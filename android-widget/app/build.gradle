plugins { id 'com.android.application' }
android {
    namespace 'om.school.notebookwidget'
    compileSdk 35
    defaultConfig {
        applicationId 'om.school.notebookwidget'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    signingConfigs {
        release {
            def keyFile = file('teacher-notebook-release.jks')
            if (keyFile.exists() && System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS')) {
                storeFile keyFile
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
 implementation 'androidx.browser:browser:1.8.0'
 implementation 'androidx.credentials:credentials:1.5.0'
 implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
 implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

// Share the original school logo between web and Android.
android.sourceSets.main.res.srcDir("$buildDir/generated/school-icon/res")
tasks.register('prepareSchoolIcon', Copy) {
 from(file('../../assets/school-icon-512.png'))
 into(file("$buildDir/generated/school-icon/res/drawable-nodpi"))
 rename { 'school_original_icon.png' }
}
tasks.named('preBuild').configure { dependsOn('prepareSchoolIcon') }
