<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة إدارة المشرفين</title><style>body{margin:0;background:#f3f7f5;color:#163d30;font:16px system-ui,Tahoma}main{max-width:850px;margin:30px auto;padding:18px}section{background:white;border:1px solid #dce7e0;border-radius:16px;padding:20px;margin:16px 0}button,select,input{font:inherit;border-radius:10px;padding:11px;margin:6px}button{background:#08794f;color:white;border:0;cursor:pointer}select,input{border:1px solid #bdcfc5}label{display:block;margin:10px 0}.tag{background:#fff0c9;color:#74540b;padding:8px 12px;border-radius:24px;display:inline-block}.row{display:flex;flex-wrap:wrap;gap:8px}.person{border:1px solid #d9e8df;border-radius:10px;padding:12px;margin:9px 0}.ok{color:#08794f}.bad{color:#ad322a}.muted{color:#6a7a72}</style></head><body><main><span class="tag">تجربة توضيحية فقط — لا حسابات حقيقية</span><h1>إدارة المشرفين واستعادة الإدارة</h1><p>هذه المعاينة تشرح إجراءات التفويض والاستعادة. لا يمكن تفعيل المشرفين أو التحقق من Google دون خادم موثّق.</p><section><h2>الحسابات الافتراضية</h2><div id="people"></div></section><section><h2>محاكاة إجراء إداري</h2><label>المشرف الذي ينفذ الإجراء <select id="actor"></select></label><label>الإجراء <select id="action"><option value="invite">دعوة مشرف جديد</option><option value="activate">تفعيل مشرف معلق</option><option value="deactivate">تعطيل مشرف</option><option value="bootstrap">استعادة المؤسس عند انعدام المشرفين</option></select></label><label>الحساب المستهدف <select id="target"></select></label><label>معرف Google للحساب المدعو (افتراضي) <input id="newsub" value="new-demo-sub"></label><div class="row"><button id="check">التحقق من السياسة</button><button id="empty">محاكاة عدم وجود مشرف نشط</button><button id="reset">إعادة بيانات التجربة</button></div><p id="result" aria-live="polite"></p><p class="muted">التحقق هنا يطبق سياسة محلية فقط؛ لا يحفظ أي تغيير ولا يمنح أي صلاحيات فعلية.</p></section></main><script type="module">
import {evaluateSupervisorAction} from './supervisor-policy.mjs';
const founderSub='founder-demo';const names={'founder-demo':'المؤسس','second-demo':'مشرف ثانٍ','pending-demo':'مشرف بانتظار التفعيل'};let supervisors=[];
const actor=document.getElementById('actor'),target=document.getElementById('target'),people=document.getElementById('people'),result=document.getElementById('result');
function reset(){supervisors=[{sub:founderSub,role:'supervisor',status:'active'},{sub:'second-demo',role:'supervisor',status:'active'},{sub:'pending-demo',role:'supervisor',status:'pending'}];render()}
function render(){people.replaceChildren();actor.replaceChildren();target.replaceChildren();for(const s of supervisors){const p=document.createElement('div');p.className='person';p.textContent=(names[s.sub]||s.sub)+' — '+(s.status==='active'?'مفعّل':s.status==='pending'?'بانتظار التفعيل':'معطّل');people.append(p)}for(const [el,includeNew] of [[actor,false],[target,true]]){const values=[...supervisors.map(s=>s.sub),...(includeNew?['new-demo-sub']:[])];if(!values.includes(founderSub))values.unshift(founderSub);for(const id of values){const o=document.createElement('option');o.value=id;o.textContent=names[id]||id;el.append(o)}}actor.value=founderSub;target.value='pending-demo';result.textContent=''}
document.getElementById('check').addEventListener('click',()=>{try{const action=document.getElementById('action').value;const targetSub=action==='invite'?document.getElementById('newsub').value.trim():target.value;const decision=evaluateSupervisorAction({actorSub:actor.value,supervisors,action,targetSub,founderSub});result.className='ok';result.textContent='مسموح وفق السياسة: '+decision.operation+' — هذا فحص تجريبي لا ينفذ الإجراء.'}catch(e){result.className='bad';result.textContent='مرفوض: '+e.message}});
document.getElementById('empty').addEventListener('click',()=>{supervisors=supervisors.map(s=>({...s,status:'suspended'}));render();result.textContent='تمت محاكاة تعطيل جميع المشرفين؛ جرب إجراء الاستعادة بحساب المؤسس.'});
document.getElementById('reset').addEventListener('click',reset);reset();
</script></body></html>
