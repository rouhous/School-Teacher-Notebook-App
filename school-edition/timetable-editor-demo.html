<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحرير الجداول | معاينة المشرف</title><style>body{margin:0;background:#f3f7f5;color:#153d2e;font:16px system-ui,Tahoma}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #dce8df;border-radius:16px;padding:20px;margin:15px 0}label{display:block;margin:12px 0}select,input,button{font:inherit;padding:10px;border-radius:9px}select,input{border:1px solid #bcd3c4;max-width:100%}button{background:#087950;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.warning{background:#fff2cd;padding:12px;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:540px}td,th{text-align:right;border-bottom:1px solid #e0e9e3;padding:9px}.scroll{overflow:auto}.good{color:#087950}.bad{color:#aa2f25}</style></head><body><main><h1>تعديل جدول معلم أو حصة</h1><p class="warning">نسخة تجريبية ببيانات افتراضية. لا تحفظ على الخادم ولا تؤثر في جداول المدرسة.</p><section><label>المدرسة <select id="school"><option value="boys">الذكور</option><option value="girls">الإناث</option></select></label><label>المعلم <select id="teacher"></select></label><label>اليوم <select id="day"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option></select></label><label>رقم الحصة <input id="period" type="number" min="1" max="12" value="1"></label><label>نوع الحصة <select id="kind"><option value="lesson">درس</option><option value="reserve">احتياط</option></select></label><label>الصف (للدروس) <input id="classId" value="9/1"></label><label>المادة (للدروس) <input id="subject" value="اللغة الإنجليزية"></label><label>الأولوية (للاحتياط) <select id="priority"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><button id="preview">معاينة التعديل</button><p id="message" aria-live="polite"></p></section><section><h2>الجدول المقترح</h2><div class="scroll"><table><thead><tr><th>المدرسة</th><th>المعلم</th><th>اليوم</th><th>الحصة</th><th>النوع</th><th>الصف / الأولوية</th></tr></thead><tbody id="rows"></tbody></table></div><p>يجب فحص تعارض الصفوف والمعلمين قبل اعتماد أي تعديل فعلي. لا يوجد زر اعتماد في هذه المعاينة.</p></section></main><script type="module">
import {previewTimetableChange} from './timetable-change.mjs';
import {auditTimetable} from './timetable-audit.mjs';
const teachers=[{id:'b1',schoolId:'boys',status:'active',name:'المعلم أحمد'},{id:'b2',schoolId:'boys',status:'active',name:'المعلم سالم'},{id:'g1',schoolId:'girls',status:'active',name:'المعلمة مريم'}];
const current=[{schoolId:'boys',teacherId:'b1',day:0,period:1,kind:'lesson',classId:'9/1',subject:'English'},{schoolId:'boys',teacherId:'b2',day:0,period:1,kind:'reserve',priority:'A'},{schoolId:'girls',teacherId:'g1',day:0,period:1,kind:'lesson',classId:'9/1',subject:'Arabic'}];
const $=id=>document.getElementById(id);
function populate(){const schoolId=$('school').value;$('teacher').replaceChildren();for(const t of teachers.filter(x=>x.schoolId===schoolId)){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;$('teacher').append(o)}}
function show(slots){$('rows').replaceChildren();for(const s of slots){const tr=document.createElement('tr');for(const value of [s.schoolId==='boys'?'الذكور':'الإناث',teachers.find(t=>t.id===s.teacherId)?.name||s.teacherId,['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][s.day],s.period,s.kind==='lesson'?'درس':'احتياط',s.kind==='lesson'?s.classId:s.priority]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('rows').append(tr)}}
$('school').addEventListener('change',populate);
$('preview').addEventListener('click',()=>{try{const schoolId=$('school').value,teacherId=$('teacher').value,day=Number($('day').value),period=Number($('period').value),kind=$('kind').value;const slot={schoolId,teacherId,day,period,kind,...(kind==='lesson'?{classId:$('classId').value.trim(),subject:$('subject').value.trim()}:{priority:$('priority').value})};const change=previewTimetableChange({current,incoming:[slot],scope:'slot',schoolId,teacherId});const audit=auditTimetable(change.next,teachers);if(!audit.ok){$('message').className='bad';$('message').textContent='تعذر اعتماد المقترح: '+audit.errors.map(e=>e.code).join('، ');show(current);return}$('message').className='good';$('message').textContent='المعاينة سليمة: '+change.summary.changed+' تعديل، '+change.summary.added+' إضافة. لم يُحفظ شيء.';show(change.next)}catch(e){$('message').className='bad';$('message').textContent='خطأ: '+e.message}});
populate();show(current);
</script></body></html>
