<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b47"><title>متابعة الجداول اليومية | المشرف</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,Tahoma;background:linear-gradient(140deg,#e9f3eb,#fff8e9);color:#18483d}main{max-width:1150px;margin:auto;padding:16px}header,.card{background:#fff;border:1px solid #e4d5b6;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #123b2912}h1,h2{color:#075b47;margin:8px 0 16px}a{color:#075b47}select,button{font:inherit;border-radius:10px;border:1px solid #b5c9c0;padding:12px;max-width:100%}button{background:#075b47;color:white;cursor:pointer}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.filters label{display:flex;flex-direction:column;gap:5px;font-weight:700}.scroll{overflow:auto;max-height:70vh}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:11px 9px;text-align:right;border:1px solid #e1e8e3;vertical-align:top}th{background:#e4f0e9;position:sticky;top:0}small{color:#60786d}.empty{padding:24px;text-align:center}#login{display:none}#login.show{display:block}#status{min-height:24px}@media(max-width:600px){main{padding:8px}header,.card{padding:12px}.filters{grid-template-columns:1fr 1fr}}</style><script src="./session-auth.js"></script></head><body><main><header><a href="founder-dashboard.html">العودة إلى لوحة المشرف</a><h1>متابعة الجداول اليومية</h1><p>الجدول العام وجداول الصفوف والمعلمين — عرض للمتابعة دون تعديل.</p></header><section class="card" id="login"><h2>تأكيد حساب المشرف</h2><div id="google"></div></section><section class="card"><div class="filters"><label>المدرسة<select id="school"><option value="boys">مدرسة البنين</option><option value="girls">مدرسة البنات</option></select></label><label>اليوم<select id="day"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option></select></label><label>نوع الجدول<select id="view"><option value="all">الجدول العام</option><option value="class">جدول الصف</option><option value="teacher">جدول المعلم</option></select></label><label>الصف / المعلم<select id="item" disabled><option value="">الكل</option></select></label></div><p id="status" role="status">جارٍ استعادة جلسة المشرف...</p><button id="reload" type="button">تحديث الجداول</button></section><section class="card"><h2 id="heading">الحصص</h2><div class="scroll"><table><thead><tr id="cols"></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const $=id=>document.getElementById(id);let credential=schoolAuthRestore(),slots=[];
function setStatus(s){$('status').textContent=s}
function td(tr,s){const x=document.createElement('td');x.textContent=s==null?'—':String(s);tr.append(x)}
function th(s){const x=document.createElement('th');x.textContent=s;$('cols').append(x)}
function label(x){return x==null||x===''?'—':String(x)}
function render(){const school=$('school').value,day=Number($('day').value),mode=$('view').value;const all=slots.filter(x=>x.schoolId===school);const field=mode==='teacher'?'teacherId':'classId';const chosen=$('item').value;const list=all.filter(x=>Number(x.weekday)===day&&(!chosen||mode==='all'||String(x[field])===chosen)).sort((a,b)=>Number(a.period)-Number(b.period)||String(a.classId).localeCompare(String(b.classId),'ar'));$('heading').textContent=(mode==='all'?'الجدول العام':mode==='class'?'جدول الصف':'جدول المعلم')+' — '+$('day').selectedOptions[0].textContent;$('cols').replaceChildren();['الحصة','الصف','المعلم','المادة','الاحتياط'].forEach(th);$('rows').replaceChildren();for(const x of list){const tr=document.createElement('tr');td(tr,x.period);td(tr,label(x.classId));td(tr,label(x.teacherName));td(tr,label(x.subject));td(tr,label(x.dutyPriority));$('rows').append(tr)}if(!list.length){const tr=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=5;cell.className='empty';cell.textContent='لا توجد حصص مسجلة لهذا الاختيار.';tr.append(cell);$('rows').append(tr)}}
function options(){const mode=$('view').value,school=$('school').value,item=$('item');item.replaceChildren();const first=document.createElement('option');first.value='';first.textContent='الكل';item.append(first);item.disabled=mode==='all';if(mode==='all'){render();return}const map=new Map();for(const x of slots.filter(x=>x.schoolId===school)){const id=mode==='class'?x.classId:x.teacherId;if(!id)continue;map.set(String(id),mode==='class'?String(id):String(x.teacherName||id))}for(const [id,name] of [...map].sort((a,b)=>a[1].localeCompare(b[1],'ar'))){const o=document.createElement('option');o.value=id;o.textContent=name;item.append(o)}render()}
async function load(){if(!credential){$('login').classList.add('show');setStatus('يُرجى تسجيل الدخول بحساب المشرف.');return}try{setStatus('جارٍ تحميل الجداول المعتمدة...');const res=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-supervisor-timetables',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential})});const j=await res.json();if(!res.ok||!j.ok)throw Error(j.error||'تعذر التحقق من الصلاحيات');slots=Array.isArray(j.data)?j.data:[];$('login').classList.remove('show');setStatus('تم تحميل '+slots.length+' حصة من قاعدة البيانات.');options()}catch(e){setStatus('تعذر تحميل الجداول: '+e.message);if(/AUTH|TOKEN|FOUNDER|401|403/i.test(e.message)){$('login').classList.add('show')}}}
function onGoogle(r){if(!r?.credential)return;credential=r.credential;schoolAuthSave(credential);load()}
['school','view'].forEach(id=>$(id).addEventListener('change',options));['day','item'].forEach(id=>$(id).addEventListener('change',render));$('reload').onclick=load;
if(credential)load();else{load();let n=0;const timer=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(timer);google.accounts.id.initialize({client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});google.accounts.id.renderButton($('google'),{theme:'outline',size:'large'})}else if(++n>60){clearInterval(timer);setStatus('تعذر تحميل Google. تحقق من اتصال الإنترنت.')}},250)}
</script></body></html>
