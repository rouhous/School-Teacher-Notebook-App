<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تدقيق الجداول المدرسية</title><style>body{font:16px system-ui,Tahoma;background:#f3f7f5;color:#193f31;margin:0}main{max-width:980px;margin:25px auto;padding:18px}section{background:#fff;border:1px solid #d7e5dd;border-radius:18px;padding:22px;margin:16px 0}textarea{width:100%;min-height:240px;direction:ltr;text-align:left;font:13px monospace;border:1px solid #c9d8ce;border-radius:10px;padding:12px}button{background:#08794e;color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;cursor:pointer}table{border-collapse:collapse;width:100%;min-width:580px}th,td{padding:10px;text-align:right;border-bottom:1px solid #e1ebe5}.scroll{overflow:auto}.notice{background:#fff2ce;color:#785b0d;padding:10px;border-radius:10px}.bad{color:#b22f25}.good{color:#08794e}</style></head><body><main><h1>تدقيق الجداول قبل اعتمادها</h1><p class="notice">أداة تجريبية محلية ببيانات افتراضية. لا ترفع الملفات أو تحفظ الجداول ولا تعتمد أي تغيير.</p><section><h2>بيانات الجدول التجريبية (JSON)</h2><p>يمكن تعديل البيانات أدناه ثم فحصها. أيام الأسبوع: الأحد 0، الاثنين 1 ... السبت 6.</p><textarea id="data" spellcheck="false"></textarea><p><button id="check">فحص التعارضات</button></p></section><section><h2>نتيجة الفحص</h2><p id="summary"></p><div class="scroll"><table><thead><tr><th>النوع</th><th>رمز المشكلة</th><th>السطر</th><th>السطر المتعارض</th></tr></thead><tbody id="issues"></tbody></table></div></section></main><script type="module">
import {auditTimetable} from './timetable-audit.mjs';
const sample={teachers:[{id:'t1',schoolId:'boys',status:'active'},{id:'t2',schoolId:'boys',status:'active'},{id:'t3',schoolId:'girls',status:'active'}],slots:[{schoolId:'boys',teacherId:'t1',day:0,period:1,kind:'lesson',classId:'9/1',subject:'English'},{schoolId:'boys',teacherId:'t2',day:0,period:1,kind:'reserve',priority:'A'},{schoolId:'boys',teacherId:'t1',day:0,period:2,kind:'lesson',classId:'10/1',subject:'English'}]};
document.getElementById('data').value=JSON.stringify(sample,null,2);
document.getElementById('check').addEventListener('click',()=>{const summary=document.getElementById('summary'),tbody=document.getElementById('issues');tbody.replaceChildren();try{const data=JSON.parse(document.getElementById('data').value);if(!Array.isArray(data.slots)||!Array.isArray(data.teachers))throw Error('يجب توفير مصفوفتَي slots و teachers');const result=auditTimetable(data.slots,data.teachers);summary.className=result.ok?'good':'bad';summary.textContent=result.ok?'لم يتم اكتشاف تعارضات. عدد الحصص: '+result.slotCount:'تم اكتشاف '+result.errors.length+' مشكلة. لا تعتمد هذا الجدول.';for(const issue of [...result.errors.map(x=>({...x,type:'خطأ'})),...result.warnings.map(x=>({...x,type:'تنبيه'}))]){const tr=document.createElement('tr');for(const value of [issue.type,issue.code,issue.index===undefined?'—':issue.index+1,issue.otherIndex===undefined?'—':issue.otherIndex+1]){const td=document.createElement('td');td.textContent=value;tr.append(td)}tbody.append(tr)}}catch(e){summary.className='bad';summary.textContent='خطأ في البيانات: '+e.message}});
document.getElementById('check').click();
</script></body></html>
