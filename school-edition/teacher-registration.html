<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل المعلمين</title><style>body{font:16px system-ui;background:#eef6ee;color:#07584c}main{max-width:550px;margin:5vh auto;padding:24px;background:white;border:3px solid #c4a04d;border-radius:18px}select,button{display:block;width:100%;padding:12px;margin:15px 0}button{background:#08705f;color:white;border:0;border-radius:9px}</style><main><h1>دفتر المعلم المدرسي</h1><p>مرحبًا بك! ينظم التطبيق الحصص والغياب والاحتياط. تُحفظ البيانات سحابيًا ويعتمد المشرف حسابات المعلمين.</p><div id="google"></div><p id="status">سجل الدخول بحساب Google.</p><label>المدرسة<select id="school"><option value="">اختر</option><option value="boys">البنين</option><option value="girls">البنات</option></select></label><label>المعلم<select id="teacher"><option value="">اختر المدرسة</option></select></label><button id="submit" disabled>إرسال طلب التسجيل</button></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
let token='';const el=id=>document.getElementById(id),endpoint='https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-registration';
async function api(action,extra={}){const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:token,action,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'FAILED');return j.data}
async function load(){el('submit').disabled=true;el('teacher').replaceChildren(new Option('اختر',''));if(!token||!el('school').value)return;try{const list=await api('roster',{schoolId:el('school').value});list.forEach(x=>el('teacher').add(new Option(x.name,x.id)));el('status').textContent=list.length?'اختر اسمك.':'لا توجد أسماء في القائمة حاليًا.'}catch(e){el('status').textContent=e.message}}
el('school').onchange=load;el('teacher').onchange=()=>el('submit').disabled=!el('teacher').value;
el('submit').onclick=async()=>{el('submit').disabled=true;try{const r=await api('register',{schoolId:el('school').value,teacherId:el('teacher').value});el('status').textContent='تم إرسال الطلب رقم '+r.requestId+' للمشرف.'}catch(e){el('status').textContent=e.message}};
function onGoogle(r){token=r.credential;el('status').textContent='تم تسجيل الدخول.';load()}
let i=0;const t=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(t);google.accounts.id.initialize({client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});google.accounts.id.renderButton(el('google'),{theme:'outline',size:'large'})}else if(++i>50)clearInterval(t)},200);
</script></html>
