<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص تسجيل الدخول</title><style>body{font:17px system-ui;background:#eef5f1;color:#135449;margin:0;padding:24px}main{max-width:650px;margin:auto;background:white;border-radius:18px;padding:24px}button,a{display:inline-block;padding:12px;margin:8px 0;background:#075c4e;color:white;border:0;border-radius:10px;text-decoration:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f3;padding:12px}</style></head><body><main><h2>فحص خدمة تسجيل Google</h2><p>نسخة التشخيص: 2026-10-28-1</p><p id="state">جارٍ الفحص...</p><div id="google"></div><pre id="details"></pre><button onclick="location.reload()">إعادة الفحص</button><p><a href="teacher-home.html">العودة إلى دفتر المعلم</a></p></main><script>
const state=document.getElementById('state'),details=document.getElementById('details');
function report(x){details.textContent+=x+'\n'}
report('العنوان: '+location.pathname);
report('الاتصال: '+(navigator.onLine?'متصل':'غير متصل'));
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>{report('Service workers: '+rs.length);return Promise.all(rs.filter(r=>r.scope.includes('/school-edition/')).map(r=>r.unregister()))}).then(()=>report('تم إلغاء تسجيل التخزين القديم لهذه الصفحة')).catch(e=>report('Service worker: '+e.message))}
const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;
script.onerror=()=>{state.textContent='تعذر تنزيل مكتبة Google من الشبكة';report('Google script load: failed')};
script.onload=()=>{report('Google script load: success');try{if(!window.google?.accounts?.id)throw Error('Google API not available');google.accounts.id.initialize({client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:()=>{state.textContent='تم استقبال تسجيل الدخول. افتح واجهة المعلم.'}});google.accounts.id.renderButton(document.getElementById('google'),{theme:'outline',size:'large'});state.textContent='تم تحميل Google. إذا لم يظهر الزر، تحقق من إعدادات المتصفح.';report('Google initialization: success')}catch(e){state.textContent='تعذر تهيئة Google';report(e.message)}};
document.head.append(script);setTimeout(()=>{if(state.textContent==='جارٍ الفحص...'){state.textContent='انتهت مهلة تحميل Google (12 ثانية)';report('Google script timed out')}},12000);
</script></body></html>
