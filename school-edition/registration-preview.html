<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل المعلم | دفتر المعلم المدرسي</title><style>body{margin:0;background:#f2f7f4;color:#153c31;font:16px system-ui,Tahoma}main{max-width:650px;margin:5vh auto;padding:20px}section{background:white;padding:26px;border-radius:20px;box-shadow:0 8px 35px #134a2a14}h1{margin-top:0}label{display:block;margin:16px 0 6px;font-weight:600}select,input{display:block;width:100%;padding:13px;border:1px solid #abc4b6;border-radius:10px;font:inherit;box-sizing:border-box}button{margin-top:20px;padding:14px;border:0;border-radius:12px;background:#72877e;color:white;font:inherit;width:100%;cursor:not-allowed}.notice{background:#fff3d9;color:#755214;padding:15px;border-radius:12px;line-height:1.8}a{color:#096548}</style></head><body><main><section><p><a href="./">العودة إلى لوحة المشرف</a></p><h1>طلب تسجيل معلم</h1><p class="notice">هذه واجهة معاينة فقط. تسجيل Google والتحقق من الهوية واعتماد المشرف غير متصلين بخادم حاليًا. لا تدخل معلومات شخصية حقيقية، ولا يمكن تقديم طلب من هذه الصفحة.</p><label for="school">المدرسة</label><select id="school"><option>اختر المدرسة</option><option>مدرسة البنين — نموذج</option><option>مدرسة البنات — نموذج</option></select><label for="name">اسم المعلم (تجريبي)</label><input id="name" placeholder="مثال: معلم تجريبي" autocomplete="off"><button disabled aria-disabled="true">تقديم طلب التسجيل — غير متاح حاليًا</button><p>بعد تفعيل الخادم، ستتم المصادقة عبر Google والتحقق من المدرسة وموافقة المشرف قبل السماح بالوصول.</p></section></main></body></html>
