<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من المشرف المؤسس</title><style>body{font:16px system-ui,Tahoma;background:#f2f7f4;color:#153c31;margin:0}main{max-width:620px;margin:6vh auto;padding:22px}section{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #1233}button{padding:12px;border:0;border-radius:9px}code{overflow-wrap:anywhere}a{color:#096548}</style><main><section><a href="../">الصفحة الرئيسية</a><h1>التحقق من هوية المشرف المؤسس</h1><p>هذه الخطوة تتحقق من ملكية حساب Google المحدد فقط. لا تمنح صلاحيات المشرف تلقائيًا.</p><div id="signin"></div><p id="status" role="status">اختر حساب rouhous@gmail.com.</p><p id="subject"></p><button id="copy" hidden>نسخ معرّف الحساب للتحقق الإداري</button></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const statusEl=document.getElementById('status'),subjectEl=document.getElementById('subject'),copy=document.getElementById('copy');
let verifiedSubject='';
async function onGoogle(r){
 statusEl.textContent='جارٍ التحقق من Google على الخادم...';
 try{
  const response=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/founder-identity-check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:r.credential})});
  const data=await response.json();
  if(!response.ok||!data.ok)throw Error('لم تنجح مطابقة هوية حساب المشرف المؤسس.');
  verifiedSubject=data.subject;
  subjectEl.textContent='معرّف Google الثابت: '+verifiedSubject;
  statusEl.textContent='تم التحقق من الهوية. الحساب لم يحصل بعد على صلاحية المشرف.';
  copy.hidden=false;
 }catch(e){statusEl.textContent=e.message||'تعذّر التحقق';copy.hidden=true}
}
copy.onclick=()=>navigator.clipboard.writeText(verifiedSubject);
let attempts=0;const t=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(t);google.accounts.id.initialize({client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});google.accounts.id.renderButton(document.getElementById('signin'),{theme:'outline',size:'large',width:270})}else if(++attempts>=40){clearInterval(t);statusEl.textContent='تعذّر تحميل خدمة Google.'}},250);
</script></html>
