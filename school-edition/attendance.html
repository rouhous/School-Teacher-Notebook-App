<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل الحضور المدرسي</title><style>body{margin:0;font:16px system-ui,Tahoma;background:#eef5f1;color:#135449}main{max-width:740px;margin:20px auto;padding:15px}section{background:white;padding:22px;border-radius:18px;margin:14px 0;border-top:4px solid #bd9b4c}h1{color:#086154}button,input,select{font:inherit;padding:9px;border:1px solid #c6d9d1;border-radius:9px}button{background:#086456;color:white;border:0}li{padding:13px 0;border-bottom:1px solid #e3eee8;display:flex;gap:10px;align-items:center;justify-content:space-between}small{color:#6b7773}a{color:#086456}#google{margin:20px 0}</style></head><body><main><a href="teacher-home.html">العودة إلى دفتر المعلم</a><h1>سجل الحضور والغياب</h1><section><div id="google"></div><p id="status">سجّل الدخول بحساب المعلم المعتمد.</p><label>التاريخ <input id="date" type="date"></label><button id="load" disabled>عرض الطلاب</button></section><section><h2>طلاب الصفوف المسندة إليك</h2><p><small>لا تُعرض إلا بيانات الطلاب المرتبطين بجدولك الرسمي.</small></p><ul id="students"></ul></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
let credential='';const $=id=>document.getElementById(id);$('date').value=new Date().toLocaleDateString('en-CA');
async function api(action,extra={}){const r=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-teacher-attendance',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential,action,date:$('date').value,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'تعذر حفظ البيانات');return j.data}
async function load(){try{$('status').textContent='جارٍ تحميل القائمة...';const d=await api('list');$('students').replaceChildren(...d.students.map(x=>{const li=document.createElement('li'),name=document.createElement('span'),select=document.createElement('select');name.textContent=x.classId+' — '+x.name;[['','اختر'],['present','حاضر'],['absent','غائب'],['late','متأخر'],['excused','بعذر']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)});select.value=x.status||'';select.onchange=async()=>{if(!select.value)return;select.disabled=true;try{await api('save',{studentCode:x.studentCode,status:select.value});$('status').textContent='تم حفظ الحضور.'}catch(e){$('status').textContent=e.message}finally{select.disabled=false}};li.append(name,select);return li}));$('status').textContent=d.students.length?'تم تحميل '+d.students.length+' طالبًا.':'لا توجد قوائم طلاب منشورة لصفوفك بعد.'}catch(e){$('status').textContent=e.message}}
$('load').onclick=load;function onGoogle(r){credential=r.credential;$('load').disabled=false;load()}
let n=0;const timer=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(timer);google.accounts.id.initialize({client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});google.accounts.id.renderButton($('google'),{theme:'outline',size:'large'})}else if(++n>40){clearInterval(timer);$('status').textContent='تعذر تحميل Google. جرّب Chrome.'}},250);
</script></body></html>
