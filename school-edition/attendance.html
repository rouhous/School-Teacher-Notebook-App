<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل الحضور المدرسي</title><style>body{margin:0;font:16px system-ui,Tahoma;background:#eef5f1;color:#135449}main{max-width:740px;margin:20px auto;padding:15px}section{background:white;padding:22px;border-radius:18px;margin:14px 0;border-top:4px solid #bd9b4c}h1{color:#086154}button,input,select{font:inherit;padding:9px;border:1px solid #c6d9d1;border-radius:9px}button{background:#086456;color:white;border:0}li{padding:13px 0;border-bottom:1px solid #e3eee8;display:flex;gap:10px;align-items:center;justify-content:space-between}small{color:#6b7773}a{color:#086456}#google{margin:20px 0}</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#075c4e"></head><body><main><a href="teacher-home.html">العودة إلى مساحة المعلم</a><h1>سجل الحضور والغياب</h1><section><div id="google"></div><p id="loginHint"><small>اختر حساب Google المعتمد لدى المدرسة. لن تظهر قوائم الطلاب قبل التحقق من الحساب.</small></p><p id="syncState" aria-live="polite">المزامنة: بانتظار تسجيل الدخول.</p><button id="sync" disabled>مزامنة التغييرات المحفوظة</button><p id="status">سجّل الدخول بحساب المعلم المعتمد.</p><label>التاريخ <input id="date" type="date"></label><button id="load" disabled>عرض الطلاب</button></section><section><h2>طلاب الصفوف المسندة إليك</h2><p><small>لا تُعرض إلا بيانات الطلاب المرتبطين بجدولك الرسمي.</small></p><ul id="students"></ul></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./session-auth.js"></script><script>
let credential='',userKey='',syncing=false;const $=id=>document.getElementById(id);
function validDay(v){if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00Z');return !Number.isNaN(d.valueOf())&&d.toISOString().slice(0,10)===v;}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
function storeKey(type){return 'school-offline-v1:'+userKey+':'+type}
function readStore(type,fallback){try{return JSON.parse(localStorage.getItem(storeKey(type)))||fallback}catch{return fallback}}
function writeStore(type,value){try{localStorage.setItem(storeKey(type),JSON.stringify(value));return true}catch{return false}}
function updateSync(){if(!userKey)return;const count=readStore('queue',[]).length;$('syncState').textContent=count?'تغييرات محفوظة على الجهاز بانتظار المزامنة: '+count:'لا توجد تغييرات محلية بانتظار الإرسال';$('sync').disabled=!credential||!count}
async function flush(){if(syncing||!credential||!userKey||!schoolAuthRestore()||!navigator.onLine)return;syncing=true;try{const queue=readStore('queue',[]);if(!queue.length){updateSync();return}const pending=[];for(let i=0;i<queue.length;i++){const item=queue[i];if(!validDay(item.date)||!['present','absent','late','excused'].includes(item.status)||typeof item.studentCode!=='string'){pending.push(...queue.slice(i));break}try{await api('save',{studentCode:item.studentCode,status:item.status,date:item.date})}catch{pending.push(...queue.slice(i));break}}const current=readStore('queue',[]),sent=queue.filter(q=>!pending.includes(q));writeStore('queue',current.filter(q=>!sent.some(x=>x.studentCode===q.studentCode&&x.date===q.date&&x.status===q.status)));updateSync();if(pending.length)$('status').textContent='تعذرت مزامنة بعض التغييرات. ستتم المحاولة عند توفر اتصال وتسجيل دخول صالح.';else $('status').textContent='اكتملت مزامنة الحضور.'}finally{syncing=false}}
$('sync').onclick=flush;window.addEventListener('online',()=>{if(credential)flush()});$('date').value=new Date().toLocaleDateString('en-CA');
async function api(action,extra={}){if(!credential||!userKey||!schoolAuthRestore())throw Error('انتهت جلسة المعلم. يرجى تسجيل الدخول مجددًا.');if(!validDay(extra.date||$('date').value))throw Error('التاريخ غير صالح.');const r=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-teacher-attendance',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential,action,date:$('date').value,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'تعذر حفظ البيانات');return j.data}
async function load(){try{if(!credential||!userKey||!validDay($('date').value))throw Error('اختر تاريخًا صحيحًا وسجّل الدخول.');$('status').textContent='جارٍ تحميل القائمة...';let d;try{d=await api('list');if(userKey){writeStore('students',d.students.map(({studentCode,classId,name})=>({studentCode,classId,name})));writeStore('attendance:'+$('date').value,d.students)}}catch(e){const cached=readStore('students',null);if(!cached)throw e;const day=readStore('attendance:'+$('date').value,[]);d={students:cached.map(x=>({...x,status:day.find(y=>y.studentCode===x.studentCode)?.status||''}))};$('status').textContent='وضع دون اتصال: قائمة الطلاب محفوظة على هذا الجهاز.'}const queued=readStore('queue',[]);d.students=d.students.map(x=>{const q=queued.find(y=>y.studentCode===x.studentCode&&y.date===$('date').value);return q?{...x,status:q.status}:x});$('students').replaceChildren(...d.students.map(x=>{const li=document.createElement('li'),name=document.createElement('span'),select=document.createElement('select');name.textContent=x.classId+' — '+x.name;[['','اختر'],['present','حاضر'],['absent','غائب'],['late','متأخر'],['excused','بعذر']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)});select.value=x.status||'';select.onchange=async()=>{if(!select.value||!credential||!validDay($('date').value))return;select.disabled=true;try{const selectedDate=$('date').value;const queue=readStore('queue',[]).filter(q=>!(q.studentCode===x.studentCode&&q.date===selectedDate));queue.push({studentCode:x.studentCode,date:selectedDate,status:select.value});if(!writeStore('queue',queue))throw Error('تعذر الحفظ على الجهاز؛ تحقق من مساحة التخزين.');updateSync();$('status').textContent='حُفظ التعديل محليًا.';if(navigator.onLine)await flush()}catch(e){$('status').textContent=e.message}finally{select.disabled=false}};li.append(name,select);return li}));$('status').textContent=d.students.length?'تم تحميل '+d.students.length+' طالبًا.':'لا توجد قوائم طلاب منشورة لصفوفك بعد.'}catch(e){$('status').textContent=e.message}}
$('load').onclick=load;$('date').addEventListener('change',()=>{if(userKey)load()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&credential)flush()});let loginGeneration=0;let attendanceExpiryTimer=null;
function closeAttendanceSession(message){loginGeneration++;credential='';userKey='';$('load').disabled=true;$('sync').disabled=true;$('students').replaceChildren();if(attendanceExpiryTimer)clearTimeout(attendanceExpiryTimer);schoolAuthClear();$('status').textContent=message||'يرجى تسجيل الدخول مجددًا.';}
async function onGoogle(r){
 const generation=++loginGeneration;
 credential='';userKey='';$('load').disabled=true;$('sync').disabled=true;
 $('students').replaceChildren();$('status').textContent='جارٍ التحقق من حساب المعلم...';
 try{
  const response=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-teacher-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:r.credential})});
  const result=await response.json();
  if(generation!==loginGeneration)return;
  if(!response.ok||!result.ok||!result.data?.approved)throw Error('حساب المعلم غير معتمد أو انتهت الجلسة.');
  const payload=JSON.parse(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  if(!payload.sub||!Number.isFinite(Number(payload.exp))||Number(payload.exp)*1000<=Date.now()+30000)throw Error('انتهت صلاحية الجلسة.');
  schoolAuthSave(r.credential);credential=r.credential;userKey=String(payload.sub);if(attendanceExpiryTimer)clearTimeout(attendanceExpiryTimer);attendanceExpiryTimer=setTimeout(()=>closeAttendanceSession('انتهت جلسة الحضور. سجّل الدخول مجددًا.'),Math.min(2147483647,Number(payload.exp)*1000-Date.now()-15000));
  $('load').disabled=false;updateSync();await load();if(generation===loginGeneration)await flush();
 }catch(e){if(generation!==loginGeneration)return;credential='';userKey='';$('load').disabled=true;$('sync').disabled=true;$('status').textContent=e.message||'تعذر التحقق من الحساب';}
}

let n=0;const timer=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(timer);google.accounts.id.initialize({auto_select:true,client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});google.accounts.id.renderButton($('google'),{theme:'outline',size:'large'});if(!schoolAuthRestore())google.accounts.id.prompt()}else if(++n>40){clearInterval(timer);$('status').textContent='تعذر تحميل Google. جرّب Chrome.'}},250);

const restoredCredential=schoolAuthRestore();if(restoredCredential)onGoogle({credential:restoredCredential});
</script></body></html>
