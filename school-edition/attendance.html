<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل الحضور المدرسي</title><style>body{margin:0;font:16px system-ui,Tahoma;background:#eef5f1;color:#135449}main{max-width:740px;margin:20px auto;padding:15px}section{background:white;padding:22px;border-radius:18px;margin:14px 0;border-top:4px solid #bd9b4c}h1{color:#086154}button,input,select{font:inherit;padding:9px;border:1px solid #c6d9d1;border-radius:9px}button{background:#086456;color:white;border:0}li{padding:13px 0;border-bottom:1px solid #e3eee8;display:flex;gap:10px;align-items:center;justify-content:space-between}small{color:#6b7773}a{color:#086456}#google{margin:20px 0}</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#075c4e"></head><body><main><a href="teacher-home.html">العودة إلى دفتر المعلم</a><h1>سجل الحضور والغياب</h1><section><div id="google"></div><p id="syncState" aria-live="polite">المزامنة: بانتظار تسجيل الدخول.</p><button id="sync" disabled>مزامنة التغييرات المحفوظة</button><p id="status">سجّل الدخول بحساب المعلم المعتمد.</p><label>التاريخ <input id="date" type="date"></label><button id="load" disabled>عرض الطلاب</button></section><section><h2>طلاب الصفوف المسندة إليك</h2><p><small>لا تُعرض إلا بيانات الطلاب المرتبطين بجدولك الرسمي.</small></p><ul id="students"></ul></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
let credential='',userKey='',syncing=false;const $=id=>document.getElementById(id);\nif('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});\nfunction storeKey(type){return 'school-offline-v1:'+userKey+':'+type}\nfunction readStore(type,fallback){try{return JSON.parse(localStorage.getItem(storeKey(type)))||fallback}catch{return fallback}}\nfunction writeStore(type,value){try{localStorage.setItem(storeKey(type),JSON.stringify(value));return true}catch{return false}}\nfunction updateSync(){if(!userKey)return;const count=readStore('queue',[]).length;$('syncState').textContent=count?'تغييرات محفوظة على الجهاز بانتظار المزامنة: '+count:'جميع التغييرات المحلية متزامنة';$('sync').disabled=!credential||!count}\nasync function flush(){if(syncing||!credential||!navigator.onLine)return;syncing=true;try{const queue=readStore('queue',[]);if(!queue.length){updateSync();return}const pending=[];for(let i=0;i<queue.length;i++){const item=queue[i];try{await api('save',{studentCode:item.studentCode,status:item.status,date:item.date})}catch{pending.push(...queue.slice(i));break}}const current=readStore('queue',[]),sent=queue.filter(q=>!pending.includes(q));writeStore('queue',current.filter(q=>!sent.some(x=>x.studentCode===q.studentCode&&x.date===q.date&&x.status===q.status)));updateSync();if(pending.length)$('status').textContent='تعذرت مزامنة بعض التغييرات. ستتم المحاولة عند توفر اتصال وتسجيل دخول صالح.';else $('status').textContent='اكتملت مزامنة الحضور.'}finally{syncing=false}}\n$('sync').onclick=flush;window.addEventListener('online',()=>{if(credential)flush()});$('date').value=new Date().toLocaleDateString('en-CA');
async function api(action,extra={}){const r=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-teacher-attendance',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential,action,date:$('date').value,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'تعذر حفظ البيانات');return j.data}
async function load(){try{$('status').textContent='جارٍ تحميل القائمة...';let d;try{d=await api('list');if(userKey){writeStore('students',d.students.map(({studentCode,classId,name})=>({studentCode,classId,name})));writeStore('attendance:'+$('date').value,d.students)}}catch(e){const cached=readStore('students',null);if(!cached)throw e;const day=readStore('attendance:'+$('date').value,[]);d={students:cached.map(x=>({...x,status:day.find(y=>y.studentCode===x.studentCode)?.status||''}))};$('status').textContent='وضع دون اتصال: قائمة الطلاب محفوظة على هذا الجهاز.'}const queued=readStore('queue',[]);d.students=d.students.map(x=>{const q=queued.find(y=>y.studentCode===x.studentCode&&y.date===$('date').value);return q?{...x,status:q.status}:x});$('students').replaceChildren(...d.students.map(x=>{const li=document.createElement('li'),name=document.createElement('span'),select=document.createElement('select');name.textContent=x.classId+' — '+x.name;[['','اختر'],['present','حاضر'],['absent','غائب'],['late','متأخر'],['excused','بعذر']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)});select.value=x.status||'';select.onchange=async()=>{if(!select.value)return;select.disabled=true;try{const queue=readStore('queue',[]).filter(q=>!(q.studentCode===x.studentCode&&q.date===$('date').value));queue.push({studentCode:x.studentCode,date:$('date').value,status:select.value});if(!writeStore('queue',queue))throw Error('تعذر الحفظ على الجهاز؛ تحقق من مساحة التخزين.');updateSync();$('status').textContent='حُفظ التعديل محليًا.';if(navigator.onLine)await flush()}catch(e){$('status').textContent=e.message}finally{select.disabled=false}};li.append(name,select);return li}));$('status').textContent=d.students.length?'تم تحميل '+d.students.length+' طالبًا.':'لا توجد قوائم طلاب منشورة لصفوفك بعد.'}catch(e){$('status').textContent=e.message}}
$('load').onclick=load;$('date').addEventListener('change',()=>{if(userKey)load()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&credential)flush()});function onGoogle(r){schoolAuthSave(r.credential);credential=r.credential;try{const payload=JSON.parse(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));userKey=String(payload.sub||'');}catch{userKey=''}$('load').disabled=!userKey;updateSync();load().then(flush)}
let n=0;const timer=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(timer);google.accounts.id.initialize({auto_select:true,client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});google.accounts.id.renderButton($('google'),{theme:'outline',size:'large'});if(!schoolAuthRestore())google.accounts.id.prompt()}else if(++n>40){clearInterval(timer);$('status').textContent='تعذر تحميل Google. جرّب Chrome.'}},250);

const restoredCredential=schoolAuthRestore();if(restoredCredential)onGoogle({credential:restoredCredential});
</script></body></html>
