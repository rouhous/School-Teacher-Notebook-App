function checkPeriodAlarms(){
  updateActiveLessonVisual();
  if(db.alarmEnabled===false)return;
  // Visual highlighting works even without notification permission.
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date();
  const dayIdx=now.getDay();
  if(dayIdx<0||dayIdx>4)return;
  const nowMin=now.getHours()*60+now.getMinutes();
  const before=Number(db.alarmBeforeMin??5);
  const beforeEnd=Number(db.alarmBeforeEndMin??5);
  const todaySlots=db.schedule.filter(s=>Number(s.day)===dayIdx&&!isRestSlot(s));
  const pers=db.periods||[];
  const keysToCheck=new Set();
  todaySlots.forEach(s=>keysToCheck.add(s.periodId));
  // also explicit period alarms even if rest (user may want break reminder)
  Object.keys(db.periodAlarms||{}).forEach(k=>{
    const[d,p]=k.split('_').map(Number);
    if(d===dayIdx)keysToCheck.add(p);
  });
  keysToCheck.forEach(pid=>{
    const per=pers.find(p=>Number(p.id)===Number(pid));
    if(!isBreakPeriod(per)&&!todaySlots.some(s=>Number(s.periodId)===Number(pid))){
      // skip if no class and no explicit alarm
      if(!(db.periodAlarms&&db.periodAlarms[dayIdx+'_'+pid]))return;
    }

async function fetchApproved(path){
 const response=await fetch(schoolApi+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:schoolNotebookCredential})});
 const result=await response.json();
 if(!response.ok||!result.ok)throw Error('تعذر تحميل بيانات المدرسة المعتمدة');
 return result.data;
}
async function syncManaged(){
 try{
  const [table,roster]=await Promise.all([fetchApproved('school-teacher-timetable'),fetchApproved('school-teacher-students')]);
  if(!table?.approved)throw Error('الحساب غير معتمد لعرض الجدول');
  managedSchedule=Array.isArray(table.slots)?table.slots:[];
  // Translate the supervisor's published slots into the ORIGINAL notebook schedule model.
  // Keep identifiers stable so attendance and grades remain linked to their students.
  const existingClasses=Array.isArray(db.classes)?db.classes:[];
  const scheduleClasses=new Map(existingClasses.map(c=>[String(c.name),c]));
  for(const slot of managedSchedule){
    if(!slot||!slot.classId||slot.dutyPriority)continue;
    const name=String(slot.classId);
    if(!scheduleClasses.has(name))scheduleClasses.set(name,{id:'school-class-'+String(slot.schoolId||'')+'-'+name,name,subject:String(slot.subject||'')});
  }
  db.classes=[...scheduleClasses.values()];
  db.schedule=managedSchedule.filter(x=>x&&Number.isInteger(Number(x.weekday))&&Number.isInteger(Number(x.period))).map(x=>{
    const cls=x.dutyPriority?null:scheduleClasses.get(String(x.classId||''));
    return {day:Number(x.weekday),periodId:Number(x.period),classId:cls?.id||'',subject:String(x.subject||x.dutyPriority||''),dutyPriority:String(x.dutyPriority||(!cls&&/^[ABCD]$/i.test(String(x.subject||''))?x.subject:'')),type:cls?'lesson':'rest'};
  });
  db.scheduleView='data';
  db.onboarded=true;

  // Period times may only be changed by published supervisor data, never by a local guess.
  const publishedPeriods=Array.isArray(table.periods)?table.periods:Array.isArray(table.timing)?table.timing:[];
  if(publishedPeriods.length){const valid=publishedPeriods.filter(x=>x&&/^([01]\d|2[0-3]):[0-5]\d$/.test(String(x.time||''))&&Number.isInteger(Number(x.id)));if(valid.length){db.periods=valid.map(x=>({id:Number(x.id),nameAr:String(x.nameAr||'الحصة '+x.id),nameEn:String(x.nameEn||'Period '+x.id),time:String(x.time),endTime:x.endTime||undefined,type:x.type||undefined}));save();}}
  // Supervisor timetable numbers refer to eight teaching periods; the notebook
  // inserts break as UI period 5. Shift 5–8 only when the published period
  // definitions use the nine-slot (including break) layout.
  const displayHasBreak=(db.periods||[]).some(isBreakPeriod);
  const sourceHasBreak=publishedPeriods.some(isBreakPeriod);
  if(displayHasBreak&&!sourceHasBreak){
    db.schedule=db.schedule.map(slot=>({...slot,periodId:slot.periodId>=5&&slot.periodId<=8?slot.periodId+1:slot.periodId}));
  }
  managedRoster=Array.isArray(roster)?roster:[];
  loaded=true;
  // Approved rosters are authoritative; preserve all existing class/student-linked records.
  const previousClasses=Array.isArray(db.classes)?db.classes:[];
  const previousStudents=Array.isArray(db.students)?db.students:[];
  const classByKey=new Map(previousClasses.map(c=>[String(c.schoolRosterKey||c.name),c]));
  const studentByCode=new Map(previousStudents.filter(st=>st.studentNumber).map(st=>[String(st.studentNumber),st]));
  const nextClasses=[],nextStudents=[],ids=new Map();
  for(const st of managedRoster){
    if(!st||!st.classId||!st.name)continue;
    const key=String(st.schoolId||'')+'|'+String(st.classId);
    if(!ids.has(key)){
      const prior=classByKey.get(key)||previousClasses.find(c=>c.name===String(st.classId)&&(!c.schoolRosterKey||c.schoolRosterKey===key));
      const id=prior?.id||'school-'+key;
      ids.set(key,id);
      nextClasses.push({...prior,id,name:String(st.classId),schoolRosterKey:key,subject:prior?.subject||''});
    }
    const code=String(st.studentCode||'');
    const prior=code?studentByCode.get(code):previousStudents.find(x=>x.classId===ids.get(key)&&x.name===String(st.name));
    const id=prior?.id||'school-student-'+(code||key+'|'+st.name);
    nextStudents.push({...prior,id,name:String(st.name),classId:ids.get(key),studentNumber:code});
  }
  // Never erase the teacher's existing work when the central roster is temporarily empty.
  if(nextStudents.length){
    // Merge approved roster into existing classes; do not erase timetable-only classes.
    const mergedClasses=new Map((db.classes||[]).map(c=>[String(c.id),c]));
    nextClasses.forEach(c=>mergedClasses.set(String(c.id),c));
    db.classes=[...mergedClasses.values()];
    const mergedStudents=new Map((db.students||[]).map(st=>[String(st.id),st]));
    nextStudents.forEach(st=>mergedStudents.set(String(st.id),st));
    db.students=[...mergedStudents.values()];
    db.onboarded=true;
  }
  // Keep schedule references pointing to the same class IDs as approved students.
  const rosterClassIds=new Map(nextClasses.map(c=>[String(c.name),c.id]));
  db.schedule=db.schedule.map(slot=>{
    const cls=db.classes.find(c=>c.id===slot.classId);
    const rosterId=cls&&rosterClassIds.get(String(cls.name));
    return rosterId?{...slot,classId:rosterId}:slot;
  });
  // Persist the approved timetable even when no student list has been returned.
  save();
  replaceHome();
 }catch(e){loaded=true;managedSchedule=[];replaceHome();const body=document.getElementById('homeBody');body.insertAdjacentHTML('afterbegin','<div class="school-managed-notice">تعذر جلب البيانات المعتمدة. لم يتم تعديل القوائم المحلية. حاول إعادة فتح التطبيق بعد التحقق من الاتصال.</div>');}
}
// Automatically refresh supervisor-approved rosters and timetables while the notebook is in use.
let schoolSyncRunning=false;
const schoolSyncOriginal=syncManaged;
syncManaged=async function(){
 if(schoolSyncRunning||!navigator.onLine)return;
 schoolSyncRunning=true;
 try{await schoolSyncOriginal()}finally{schoolSyncRunning=false}
};
setTimeout(syncManaged,250);
setInterval(()=>{if(document.visibilityState==='visible')syncManaged()},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncManaged()});
window.addEventListener('online',syncManaged);
})();

// Show the published A/B/C/D reserve priority in empty timetable slots.

function schoolDutyLabel(day,period){
 const slot=(db.schedule||[]).find(s=>Number(s.day)===Number(day)&&Number(s.periodId)===Number(period)&&(s.dutyPriority||(!s.classId&&/^[ABCD]$/i.test(String(s.subject||'')))));
 if(!slot)return '';
 const code=String(slot.dutyPriority||slot.subject||'').trim().toUpperCase();
 if(!/^[ABCD]$/.test(code))return '';
 return code;
}

(function protectTeacherBack(){

 armGuard();

  asking=false;
  if(!leave)return;
  // Keep the saved Google session; leaving the notebook is not signing out.
  window.location.assign('../');
 });

 });
