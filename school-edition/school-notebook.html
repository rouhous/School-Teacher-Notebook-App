<style>
:root{--p:#0f766e;--pd:#0d5c56;--pl:#ccfbf1;--pm:#14b8a6;--ac:#f59e0b;--ok:#059669;--no:#dc2626;--wn:#d97706;--bg:#f0fdfa;--card:#fff;--tx:#134e4a;--mu:#64748b;--bd:#e2e8f0;--r:16px;--sh:0 4px 20px rgba(15,118,110,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));line-height:1.55;font-size:15.5px}

button,input,select,textarea{font-family:inherit}
.header{background:linear-gradient(145deg,#0f766e,#0d9488 55%,#14b8a6);color:#fff;padding:12px 14px 16px;position:sticky;top:0;z-index:90;border-radius:0 0 20px 20px;box-shadow:0 6px 24px rgba(15,118,110,.22)}

.view-pills{display:flex;background:rgba(255,255,255,.15);border-radius:10px;padding:3px;margin-top:8px}

.view-pills button.active{background:#fff;color:var(--p)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(15,118,110,.08);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;color:#94a3b8;font-size:.62rem;font-weight:600;padding:4px 4px;border-radius:10px;min-width:48px;cursor:pointer}
.nav-btn svg{width:20px;height:20px}.nav-btn.active{color:var(--p)}
.screen{display:none;padding:14px 12px;max-width:560px;margin:0 auto;animation:fade .2s ease}
.screen.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid rgba(15,118,110,.05)}
.section-title{font-size:1.02rem;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--pm));color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.28)}

.form-group{margin-bottom:12px}.form-group label{display:block;font-size:.82rem;font-weight:700;margin-bottom:4px}

.theme-pick{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:13px;padding:10px;border-top:1px solid var(--bd);font-size:12px}
.theme-pick label{display:flex;align-items:center;gap:5px}.theme-pick input{width:28px;height:28px;border:0;background:none;padding:0}
.header{background:var(--teacher-gradient)!important}
</style>
<style>.sched-vertical{table-layout:fixed;width:100%}.sched-vertical .period-col{width:15%;background:var(--teacher-gradient);color:#fff;border-radius:8px;font-size:11px}.sched-vertical .period-col small{display:block;font-size:9px}.sched-vertical .day-col{font-size:clamp(9px,2.3vw,12px)!important;white-space:nowrap}.sched-vertical td{height:48px;overflow-wrap:anywhere}.theme-settings input[type=color]{width:42px;height:36px;padding:1px;vertical-align:middle}</style><style id="compact-schedule-tuning">
/* Reduce the visual footprint of the weekly grid by about 20% while enlarging lesson text by 20%. */
.sched-vertical{font-size:80%!important;border-spacing:2px!important}
.sched-vertical td{height:38px!important;padding:3px 2px!important}
.sched-vertical th{padding:4px 2px!important}
.sched-vertical .sc-cls,.sched-vertical .sc-subj,.sched-vertical .sc-rest{font-size:120%!important;line-height:1.15!important;font-weight:800!important}
.sched-vertical .period-col{font-size:10px!important}
.sched-vertical .period-col small{font-size:8px!important}
</style>
<style id="active-lesson-visual">
.sched-vertical td.lesson-active-now,.sched-vertical td.sched-cell.lesson-active-now{
 background:linear-gradient(135deg,#fef08a,#fbbf24)!important;
 color:#713f12!important;outline:2px solid #d97706!important;outline-offset:-2px;
 box-shadow:0 0 0 2px #f59e0b55,0 4px 14px #d9770644!important;
}
.today-lesson.lesson-active-now{background:linear-gradient(135deg,#fef08a,#fbbf24)!important;outline:2px solid #d97706}
.sched-vertical td.lesson-start-now,.today-lesson.lesson-start-now{animation:lessonGlow 1.4s ease-in-out infinite alternate}
@keyframes lessonGlow{from{filter:brightness(1)}to{filter:brightness(1.13)}}
@media(prefers-reduced-motion:reduce){.sched-vertical td.lesson-start-now,.today-lesson.lesson-start-now{animation:none}}
</style></head>

function load(){
  // Fresh install key tnb_v4 — old tnb_v3 data is not auto-migrated so you get a clean start
  try{localStorage.removeItem('tnb_v3')}catch(e){}
  try{const r=localStorage.getItem(schoolNotebookKey);if(r)Object.assign(db,JSON.parse(r))}catch(e){}
  if(db.schoolName===undefined||db.schoolName==='مدرسة وادي الحواسنة')db.schoolName='';
  if(db.alarmEnabled===undefined)db.alarmEnabled=true;
  if(db.alarmBeforeMin===undefined)db.alarmBeforeMin=5;
  if(db.alarmBeforeEndMin===undefined)db.alarmBeforeEndMin=5;
  if(!db.periodAlarms||typeof db.periodAlarms!=='object')db.periodAlarms={};
  if(!db.periodNotes||typeof db.periodNotes!=='object')db.periodNotes={};
  if(!Array.isArray(db.timingPresets))db.timingPresets=[];
  try{ensureBreakInPeriods()}catch(e){}
  try{
    const a=syncClassSubjectsFromSchedule();
    const b=purgeStaleDefaultSlots();
    if(a||b)save();
  }catch(e){}
  applyLang();
  if(window._gradeZoom===undefined)window._gradeZoom=0.7;
  setTimeout(applyStaticSchoolIcon,20); setTimeout(setupAppIconsFromBanner,80);
  setTimeout(gateAppOnBoot,0);
}
function save(){try{localStorage.setItem(schoolNotebookKey,JSON.stringify(db));if(window.cloudMarkDirty)cloudMarkDirty();return true}catch(e){try{toast(db.lang==='ar'?'تعذر الحفظ؛ قد تكون مساحة التخزين ممتلئة. صدّر نسخة احتياطية واحذف صورة الجدول الكبيرة.':'Save failed; storage may be full. Export a backup and remove a large schedule image.')}catch(_){}return false}}
function subjectsForClass(classId){
  const map={};
  (db.schedule||[]).forEach(s=>{
    if(s.classId!==classId||!s.subject)return;
    if(s.type==='break'||s.type==='rest')return;
    const sub=String(s.subject).trim();
    if(!sub||sub==='فسحة'||/راحة|استراحة|Break|Rest/i.test(sub))return;
    map[sub]=(map[sub]||0)+1;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
}
function classDisplaySubject(c){
  if(!c)return '';
  const fromSched=subjectsForClass(c.id);
  if(fromSched.length)return fromSched[0];
  return c.subject||'';
}
function syncClassSubjectsFromSchedule(){
  let changed=false;
  (db.classes||[]).forEach(c=>{
    const subs=subjectsForClass(c.id);
    if(subs.length && c.subject!==subs[0]){c.subject=subs[0];changed=true;}
  });
  return changed;
}
function purgeStaleDefaultSlots(){
  // Remove legacy demo/default Thursday period-1 English for class 10 if it doesn't match real schedule subjects
  if(!Array.isArray(db.schedule))return false;
  const before=db.schedule.length;
  db.schedule=db.schedule.filter(s=>{
    if(s.type==='break'||s.type==='rest')return true;
    const cls=db.classes.find(c=>c.id===s.classId);
    if(!cls)return true;
    // Thursday (4) period 1 only if subject is English while class primary subject is not English
    const day=Number(s.day), per=Number(s.periodId);
    if(day===4 && per===1){
      const sub=String(s.subject||'').trim();
      const primary=classDisplaySubject(cls)||cls.subject||'';
      if(/إنجليزي|انجليزي|English/i.test(sub) && primary && !/إنجليزي|انجليزي|English/i.test(primary)){
        return false;
      }
    }
    return true;
  });
  return db.schedule.length!==before;
}


const DEVICE_UNLOCK_KEY='tnb_device_unlocked_v1';

const SUPPORT_WA = '96898262956'; // +968 98262956
function waUrl(msg){
  const text=encodeURIComponent(msg||'');
  return 'https://wa.me/'+SUPPORT_WA+(text?'?text='+text:'');
}
function openSupportWhatsApp(kind){
  let msg='';
  if(kind==='pin'){
    msg='السلام عليكم، أستخدم تطبيق دفتر المعلم وأحتاج الرقم السري للدخول.';
  } else {
    msg='السلام عليكم، لدي اقتراح لتطوير تطبيق دفتر المعلم:\n';
  }
  const url=waUrl(msg);
  try{window.open(url,'_blank')}catch(e){location.href=url}
}

function expectedAppPin(){
  const h=new Date().getHours(); // 0-23 local hour only
  return '2429'+String(h);
}
function isDeviceUnlocked(){
  try{return localStorage.getItem(DEVICE_UNLOCK_KEY)==='1'}catch(e){return false}
}
function markDeviceUnlocked(){
  try{localStorage.setItem(DEVICE_UNLOCK_KEY,'1')}catch(e){}
}
function showAppLock(){
  const el=document.getElementById('appLock');
  if(!el)return;
  el.classList.remove('hidden');
  el.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  setTimeout(()=>{try{document.getElementById('lockPin')?.focus()}catch(e){}},200);
}
function hideAppLock(){
  const el=document.getElementById('appLock');
  if(!el)return;
  el.classList.add('hidden');
  el.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
function tryUnlockApp(){
  const pin=(document.getElementById('lockPin')?.value||'').trim();
  const err=document.getElementById('lockErr');
  if(pin===expectedAppPin()){
    markDeviceUnlocked();
    hideAppLock();
    if(err)err.textContent='';
    try{go(document.querySelector('.nav-btn.active')?.dataset?.s||'home')}catch(e){}
  } else {
    if(err)err.textContent=db.lang==='ar'?'كلمة المرور غير صحيحة':'Incorrect password';
    const inp=document.getElementById('lockPin');
    if(inp){inp.value='';inp.focus()}
  }
}
function gateAppOnBoot(){
  try{
    if(isDeviceUnlocked()){hideAppLock();return}
    let el=document.getElementById('appLock');
    if(!el){
      el=document.createElement('div');
      el.id='appLock';
      el.className='app-lock';
      el.innerHTML='<div class="app-lock-card"><h2>دفتر المعلم</h2><p>أدخل كلمة المرور للمتابعة<br><span style="font-size:.72rem;opacity:.85">مرة واحدة على هذا الجهاز</span></p><input id="lockPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••••"><div class="app-lock-err" id="lockErr"></div><button class="btn btn-primary btn-block" type="button" onclick="tryUnlockApp()">دخول</button><button type="button" class="wa-link" onclick="openSupportWhatsApp(\'pin\')"><span class="wa-ic">💬</span><span>اطلب الرقم السري عبر واتساب</span></button></div>';
      document.body.appendChild(el);
    }
    showAppLock();
    const inp=document.getElementById('lockPin');
    if(inp && !inp._bound){
      inp._bound=true;
      inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlockApp()});
    }
  }catch(e){console.error(e)}
}

function setupAppIconsFromBanner(){
  try{
    const img=document.querySelector('.school-banner img');
    if(!img)return;
    const apply=(source)=>{
      const w=source.naturalWidth||source.width,h=source.naturalHeight||source.height;
      if(!w||!h)return;
      const side=Math.min(h,Math.floor(w/3));
      const sx=Math.floor((w-side)/2), sy=Math.floor((h-side)/2);
      const size=192;
      const c=document.createElement('canvas');c.width=size;c.height=size;
      const ctx=c.getContext('2d');
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,size,size);
      ctx.drawImage(source,sx,sy,side,side,8,8,size-16,size-16);
      const url=c.toDataURL('image/png');
      const fav=document.getElementById('appFavicon');
      const touch=document.getElementById('appTouchIcon');
      if(fav)fav.href=url;
      if(touch)touch.href=url;
      try{
        const manifest={name:'دفتر المعلم',short_name:'دفتر المعلم',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f0fdfa',theme_color:'#0f766e',icons:[{src:url,sizes:'192x192',type:'image/png',purpose:'any maskable'}]};
        const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
        let link=document.getElementById('appManifest');
        if(!link){link=document.createElement('link');link.id='appManifest';link.rel='manifest';document.head.appendChild(link)}
        if(link.href&&link.href.startsWith('blob:'))URL.revokeObjectURL(link.href);
        link.href=URL.createObjectURL(blob);
      }catch(_){}
    };
    if(img.complete&&img.naturalWidth)apply(img);
    else img.addEventListener('load',()=>apply(img),{once:true});
  }catch(e){}
}
function exportBackup(){try{const payload={app:'TeacherNotebook',version:4,exportedAt:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='teacher-notebook-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast(db.lang==='ar'?'تم تجهيز النسخة الاحتياطية':'Backup prepared')}catch(e){toast(db.lang==='ar'?'تعذر إنشاء النسخة الاحتياطية':'Could not create backup')}}
function importBackup(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result||''));const incoming=parsed&&parsed.data?parsed.data:parsed;if(!incoming||!Array.isArray(incoming.classes)||!Array.isArray(incoming.students)||!Array.isArray(incoming.periods)||!Array.isArray(incoming.schedule))throw new Error('invalid');if(!confirm(db.lang==='ar'?'سيتم استبدال بيانات التطبيق الحالية بالنسخة المختارة. هل أنشأت نسخة احتياطية من البيانات الحالية؟':'This will replace the current app data. Have you backed up your current data?'))return;const defaults={lang:'ar',teacherName:'',schoolName:'',view:'daily',onboarded:false,classes:[],students:[],schedule:[],attendance:{},assessments:[],grades:{},notes:[],behaviors:{},seating:{},scheduleImage:null,attDate:null};const approvedClasses=db.classes,approvedStudents=db.students,approvedPeriods=db.periods,approvedSchedule=db.schedule;db=Object.assign(defaults,incoming);db.classes=approvedClasses;db.students=approvedStudents;db.periods=approvedPeriods;db.schedule=approvedSchedule;if(!Array.isArray(db.notes))db.notes=[];if(!db.attendance||typeof db.attendance!=='object')db.attendance={};if(!db.grades||typeof db.grades!=='object')db.grades={};if(!db.behaviors||typeof db.behaviors!=='object')db.behaviors={};if(!save())return;applyLang();closeM();go('home');toast(db.lang==='ar'?'تم استرجاع النسخة الاحتياطية':'Backup restored')}catch(e){alert(db.lang==='ar'?'الملف غير صالح أو ليس نسخة احتياطية من دفتر المعلم.':'Invalid file or not a Teacher Notebook backup.')}finally{input.value=''}};reader.readAsText(file)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayStr(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function applyLang(){const lang=db.lang||'ar';document.body.dataset.lang=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('langBtn').textContent=lang==='ar'?'EN':'ع';document.getElementById('appTitle').textContent=t('appTitle');document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[lang][k])el.textContent=I18N[lang][k]});updateHeaderSub()}
function toggleLang(){db.lang=db.lang==='ar'?'en':'ar';save();applyLang();const s=document.querySelector('.screen.active')?.id?.replace('sc-','')||'home';go(s)}

function go(s){document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));document.getElementById('sc-'+s).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.s===s));document.getElementById('viewPills').style.display=s==='home'?'flex':'none';if(s==='home')renderHome();if(s==='classes')renderClasses();if(s==='att'){const d=document.getElementById('attDate');if(d&&!d.value)d.value=db.attDate||todayStr();fillAtt()}if(s==='live')renderLive();if(s==='grades'){fillGrade();loadGrades()}if(s==='students'){fillStu();loadStudents()}}

function loadSample(){const c1=uid(),c2=uid();db.classes=[{id:c1,name:db.lang==='en'?'Grade 7 A':'سابع أ',subject:db.lang==='en'?'Math':'الرياضيات'},{id:c2,name:db.lang==='en'?'Grade 8 B':'ثامن ب',subject:db.lang==='en'?'Science':'العلوم'}];const n1=db.lang==='en'?['Ahmed Mohamed','Sara Ali','Khalid Yousef','Noora Saad','Fahad Abdullah','Reem Khalid']:['أحمد محمد','سارة علي','خالد يوسف','نورة سعد','فهد عبدالله','ريم خالد'];const n2=db.lang==='en'?['Yousef Ahmed','Maryam Fahad','Salman Turki']:['يوسف أحمد','مريم فهد','سلمان تركي'];db.students=[...n1.map(n=>({id:uid(),name:n,classId:c1})),...n2.map(n=>({id:uid(),name:n,classId:c2}))];const day=new Date().getDay();db.schedule=[{classId:c1,day,periodId:1,subject:db.classes[0].subject},{classId:c2,day,periodId:2,subject:db.classes[1].subject},{classId:c1,day,periodId:4,subject:db.classes[0].subject}];const a1=uid();db.assessments=[{id:a1,classId:c1,name:db.lang==='en'?'Quiz 1':'اختبار قصير 1',max:10,type:'quiz'}];db.students.filter(s=>s.classId===c1).forEach(s=>{db.grades[a1+'_'+s.id]=7+Math.floor(Math.random()*4)});if(!db.teacherName)db.teacherName=db.lang==='en'?'Teacher':'المعلم';db.onboarded=true;save();updateHeaderSub();toast(t('parseOk'));renderHome()}
function applyTeacherTheme(){
 const c=db.teacherTheme||{};
 const valid=x=>/^#[0-9a-fA-F]{6}$/.test(x||'');
 const primary=valid(c.primary)?c.primary:'#0f766e';
 const secondary=valid(c.secondary)?c.secondary:'#14b8a6';
 document.documentElement.style.setProperty('--p',primary);
 document.documentElement.style.setProperty('--pm',secondary);
 document.documentElement.style.setProperty('--pd',primary);
 document.documentElement.style.setProperty('--pl',primary+'1c');

function isBreakPeriod(p){return p&&(p.type==='break'||p.nameAr==='فسحة'||/^(فسحة|break|استراحة)$/i.test(p.nameEn||'')||/^(فسحة|break)$/i.test(p.nameAr||''))}
function isRestSlot(s){return !s||s.type==='rest'||s.classId===null||s.classId===''||s.subject==='راحة'||s.subject==='Rest'||s.subject==='فسحة'||s.type==='break'}
function schoolPeriodTemplate(){
  return [
    {id:1,nameAr:'الحصة 1',nameEn:'Period 1',time:'07:25'},
    {id:2,nameAr:'الحصة 2',nameEn:'Period 2',time:'08:10'},
    {id:3,nameAr:'الحصة 3',nameEn:'Period 3',time:'08:55'},
    {id:4,nameAr:'الحصة 4',nameEn:'Period 4',time:'09:40'},
    {id:5,nameAr:'فسحة',nameEn:'Break',time:'10:20',type:'break',endTime:'10:40'},
    {id:6,nameAr:'الحصة 5',nameEn:'Period 5',time:'10:40'},
    {id:7,nameAr:'الحصة 6',nameEn:'Period 6',time:'11:20'},
    {id:8,nameAr:'الحصة 7',nameEn:'Period 7',time:'12:00'},
    {id:9,nameAr:'الحصة 8',nameEn:'Period 8',time:'12:40'}
  ];
}
function ensureBreakInPeriods(){
  // If legacy 8 periods without break, upgrade to template with فسحة
  if(db.periods.some(isBreakPeriod)) return;
  const times=(db.periods||[]).map(p=>p.time);
  if(times.includes('07:25')||times.includes('10:40')||db.periods.length===8){
    // remap old period ids 5-8 → 6-9 for existing schedule entries
    const map={5:6,6:7,7:8,8:9};
    db.schedule=(db.schedule||[]).map(s=>{
      const np=map[s.periodId];
      return np?Object.assign({},s,{periodId:np}):s;
    });
    db.periods=schoolPeriodTemplate();
  }
}
function fillRestSlotsInSchedule(){
  // Ensure every weekday × period has either a class or an explicit rest entry
  const dayIdxs=[0,1,2,3,4];
  const pers=[...db.periods].sort((a,b)=>a.id-b.id);
  const kept=db.schedule.filter(s=>!(isRestSlot(s)&&!s.dutyPriority&&s.day>=0&&s.day<=4));
  const filled=[...kept];
  dayIdxs.forEach(di=>{
    pers.forEach(p=>{
      const hasClass=kept.some(s=>Number(s.day)===di&&Number(s.periodId)===Number(p.id)&&(!isRestSlot(s)||s.dutyPriority));
      if(!hasClass){
        filled.push({classId:null,day:di,periodId:p.id,subject:t('restPeriod'),type:'rest'});
      }
    });
  });
  db.schedule=filled;
}

function currentLessonVisualState(){
 const now=new Date(),day=now.getDay(),minute=now.getHours()*60+now.getMinutes();
 if(day>4)return null;
 const ps=(db.periods||[]).filter(p=>p&&p.time&&!isBreakPeriod(p)).sort((a,b)=>Number(a.id)-Number(b.id));
 for(let i=0;i<ps.length;i++){
  const p=ps[i],parts=String(p.time).split(':').map(Number);
  if(parts.length!==2||parts.some(n=>!Number.isFinite(n)))continue;
  const start=parts[0]*60+parts[1],next=ps[i+1];
  let end=periodEndMinutes(p);
  if(next?.time){const np=next.time.split(':').map(Number);const nextStart=np[0]*60+np[1];if(nextStart>start)end=Math.min(end,nextStart)}
  if(minute>=start&&minute<end)return {day:day,period:Number(p.id),atStart:minute===start};
 }
 return null;
}
function updateActiveLessonVisual(){

 });

function buildScheduleTableHTML(){
 const daysIdx=[0,1,2,3,4],dn=days(),periods=[...db.periods].sort((a,b)=>a.id-b.id);
 const dayLabel=i=>({'الأحد':'أحد','الاثنين':'اثنين','الثلاثاء':'ثلاثاء','الأربعاء':'أربعاء','الخميس':'خميس'}[dn[i]]||dn[i]||'');
 const subjects=new Set((db.schedule||[]).filter(x=>!isRestSlot(x)&&x.type!=='break').map(x=>String(x.subject||db.classes.find(c=>c.id===x.classId)?.subject||'').trim()).filter(Boolean));
 const cell=(di,p)=>{
  const attr=' data-day="'+di+'" data-period="'+p.id+'"';
  if(isBreakPeriod(p))return '<td class="sc-break">'+escHTML(t('breakPeriod'))+'</td>';
  const matches=(db.schedule||[]).filter(x=>Number(x.day)===di&&Number(x.periodId)===Number(p.id));

  const flags=(db.periodAlarms?.[di+'_'+p.id]?'🔔':'')+(db.periodNotes?.[di+'_'+p.id]?'📝':'');
  if(!x)return '<td class="sched-cell"'+attr+' ><span class="sc-rest">'+escHTML(schoolDutyLabel(di,p.id))+'</span><small>'+flags+'</small></td>';
  const cls=db.classes.find(c=>c.id===x.classId),name=String(cls?.name||'').replace(/\s*\/\s*1\s*$/,'').slice(0,10);
  const sub=String(x.subject||cls?.subject||'').slice(0,12);
  return '<td class="sched-cell"'+attr+' ><div class="sc-cls">'+escHTML(name)+'</div>'+(subjects.size>1?'<div class="sc-subj">'+escHTML(sub)+'</div>':'')+(flags?'<small>'+flags+'</small>':'')+'</td>';
 };
 let h='<table class="sched-compact sched-vertical"><thead><tr><th class="period-col">'+(db.lang==='ar'?'الحصة':'Period')+'</th>';
 daysIdx.forEach(di=>h+='<th class="day-col">'+escHTML(dayLabel(di))+'</th>');
 h+='</tr></thead><tbody>';
 periods.forEach(p=>{

 });
 return h+'</tbody></table>';

function renderLive(){const body=document.getElementById('liveBody');const now=new Date();const dayIdx=now.getDay();const nowMin=now.getHours()*60+now.getMinutes();let current=null;const todaySched=db.schedule.filter(s=>s.day===dayIdx).sort((a,b)=>a.periodId-b.periodId);for(const s of todaySched){if(isRestSlot(s))continue;const per=db.periods.find(p=>p.id===s.periodId);if(!per)continue;const[h,m]=per.time.split(':').map(Number);const start=h*60+m;const end=start+45;if(nowMin>=start-10&&nowMin<=end+5){current=s;break}}if(!current&&todaySched.length){for(const s of todaySched){if(isRestSlot(s))continue;const per=db.periods.find(p=>p.id===s.periodId);const[h,m]=(per?.time||'0:0').split(':').map(Number);if(h*60+m>=nowMin){current=s;break}}}if(!current){body.innerHTML=`<div class="empty"><div class="icon">⏱️</div><p>${t('noLiveClass')}</p><span>${t('addScheduleHint')}</span><button class="btn btn-primary" onclick="go('classes')">${t('goClasses')}</button></div>`;return}const per=db.periods.find(p=>p.id===current.periodId);const cls=db.classes.find(c=>c.id===current.classId);const students=db.students.filter(s=>s.classId===current.classId);const behKey=current.classId+'_'+todayStr()+'_'+current.periodId;const behMap=db.behaviors[behKey]||{};let html=`<div class="live-banner"><div><div class="title">${t('liveClass')}</div><div class="time">${periodName(per)} · ${per?.time||''} · ${cls?.name||''}</div></div><div style="font-size:1.3rem">🔔</div></div><div class="section-title">${t('selectBehavior')}</div><div class="card" style="padding:4px 10px">`;if(!students.length)html+=`<div class="empty" style="padding:20px"><p>${t('noClasses')}</p></div>`;else students.forEach(st=>{const b=behMap[st.id]||'';html+=`<div class="beh-row"><div class="beh-name">${st.name}</div><div class="beh-btns"><button class="beh-btn ${b==='pos'?'on-pos':''}" data-id="${st.id}" data-b="pos" onclick="tapBeh(this)">${t('posBeh')}</button><button class="beh-btn ${b==='neg'?'on-neg':''}" data-id="${st.id}" data-b="neg" onclick="tapBeh(this)">${t('negBeh')}</button></div></div>`});html+=`</div><button class="btn btn-primary btn-block" style="margin-top:10px" onclick="saveBeh('${behKey}')">${t('save')}</button><button class="btn btn-outline btn-block" style="margin-top:7px" onclick="jumpAtt('${current.classId}',${current.periodId})">${t('attendance')}</button>`;body.innerHTML=html}

function shiftAttDate(delta){

function onAttClassChange(){
  const cid=document.getElementById('attClass').value;
  const dayIdx=getDayIdxFromDate(attDateStr());
  const slots=periodsForClassDay(cid,dayIdx);
  const chips=document.getElementById('attPeriodChips');
  const sel=document.getElementById('attPeriod');
  if(!chips||!sel)return;
  if(!cid){
    chips.innerHTML=`<span style="color:var(--mu);font-size:.85rem">${t('selectClassFirst')}</span>`;
    sel.innerHTML='';
    document.getElementById('attBody').innerHTML='';
    document.getElementById('attSummary').style.display='none';
    return;
  }
  if(!slots.length){
    chips.innerHTML=`<span style="color:var(--mu);font-size:.85rem">${t('noPeriodForClass')}</span>`;
    sel.innerHTML='';
    document.getElementById('attBody').innerHTML=`<div class="empty" style="padding:20px"><p>${t('noPeriodForClass')}</p></div>`;
    document.getElementById('attSummary').style.display='none';
    return;
  }
  const prevPid=sel.value;
  sel.innerHTML=slots.map(s=>{
    const per=db.periods.find(p=>p.id===s.periodId);
    return `<option value="${s.periodId}">${periodName(per)} · ${per?.time||''}</option>`;
  }).join('');
  let pick=prevPid&&slots.some(s=>String(s.periodId)===String(prevPid))?prevPid:String(slots[0].periodId);
  // auto-pick current period if today
  if(attDateStr()===todayStr()){
    const nowMin=new Date().getHours()*60+new Date().getMinutes();
    let best=null,bestDiff=9999;
    slots.forEach(s=>{
      const per=db.periods.find(p=>p.id===s.periodId);
      const[h,m]=(per?.time||'0:0').split(':').map(Number);
      const diff=Math.abs(h*60+m-nowMin);
      if(diff<bestDiff){bestDiff=diff;best=s.periodId}
    });
    if(best!=null&&bestDiff<=50)pick=String(best);
  }
  sel.value=pick;
  chips.innerHTML=slots.map(s=>{
    const per=db.periods.find(p=>p.id===s.periodId);
    const on=String(s.periodId)===String(pick)?'on':'';
    return `<button type="button" class="chip ${on}" data-pid="${s.periodId}" onclick="selectAttPeriod('${s.periodId}')">${escHTML(periodName(per))}<br><small style="font-weight:600;opacity:.75">${escHTML(per?.time||'')}</small></button>`;
  }).join('')+`<button type="button" class="chip" onclick="markAllPresent()" style="border-style:dashed">${t('markAllPresent')}</button>`;
  loadAtt();
}

function isContinuousType(type){return ['activity','quiz','homework','project','assessment','extra'].includes(String(type||'').toLowerCase())}
function isFinalType(type){const x=String(type||'').toLowerCase();return x==='exam'||x==='final'}

function ensureOfficialAssessments(classId){
 const c=db.classes.find(x=>String(x.id)===String(classId));if(!c)return;
 const grade=Number((String(c.name).match(/\d+/)||[])[0]);if(!grade)return;
 const aliases={'English':'إنجليزي','انجليزي':'إنجليزي','اللغة الإنجليزية':'إنجليزي','Arabic':'لغة عربية','عربي':'لغة عربية','اسلامية':'تربية إسلامية','إسلامية':'تربية إسلامية','دراسات':'دراسات اجتماعية','رياضيات متقدمة':'رياضيات','رياضيات أساسية':'رياضيات','Math':'رياضيات'};
 let subj=String(classDisplaySubject(c)||'').trim();subj=aliases[subj]||subj;
 const bands=bandsForSubject(subj);
 const band=bands.find(b=>b===String(grade))||bands.find(b=>{const m=b.match(/^(\d+)-(\d+)$/);return m&&grade>=Number(m[1])&&grade<=Number(m[2])});
 if(!band)return;
 const preset=resolveAssessmentPreset(subj,band);if(!Array.isArray(preset))return;
 let changed=false;
 for(const a of preset){
  const key=subj+'|'+band+'|'+a.name;
  const existing=db.assessments.find(x=>x.classId===classId&&(x.officialKey===key||(x.name===a.name&&Number(x.max)===Number(a.max))));
  if(existing){if(!existing.officialKey){existing.officialKey=key;existing.official=true;changed=true;}continue;}
  db.assessments.push({id:uid(),classId,name:a.name,max:a.max,type:a.type,official:true,officialKey:key});changed=true;
 }
 if(changed)save();
}

 const a=db.assessments.find(x=>x.id===id);if(!a||a.official)return;
 a.hidden=!a.hidden;save();loadGrades();
}

function loadGrades(){
  const cid=document.getElementById('gradeClass').value;
  ensureOfficialAssessments(cid);
  const assesses=db.assessments.filter(a=>a.classId===cid&&!a.hidden);
  const students=db.students.filter(s=>s.classId===cid);
  const body=document.getElementById('gradesBody');
  if(!assesses.length){body.innerHTML=`<div class="empty"><div class="icon">📊</div><p>${t('grades')}</p><button class="btn btn-primary" onclick="openM('addAssess')">${t('addAssess')}</button></div>`;return}
  if(!students.length){body.innerHTML=`<div class="empty"><p>${t('students')}</p></div>`;return}
  // Group: continuous sub-sections, finals, others
  const cont=assesses.filter(a=>isContinuousType(a.type)&&!isFinalType(a.type)&&classifyAssessment(a.name)!=='total'&&classifyAssessment(a.name)!=='exam');
  const finals=assesses.filter(a=>isFinalType(a.type)||classifyAssessment(a.name)==='exam');
  const totalsMeta=assesses.filter(a=>classifyAssessment(a.name)==='total');
  const other=assesses.filter(a=>!cont.includes(a)&&!finals.includes(a)&&!totalsMeta.includes(a));
  const ordered=[...cont,...other];
  let h='<div class="card" style="margin-bottom:8px;padding:10px 12px"><div style="font-size:.82rem;font-weight:700;color:var(--p);margin-bottom:4px">'+t('continuous')+'</div><div style="font-size:.78rem;color:var(--mu)">'+t('subSection')+' → '+t('continuousTotal')+' · '+t('finalExam')+' → '+t('grandTotal')+'</div></div>';
  h+='<div class="card"><div class="grade-wrap"><table class="grade-table"><thead><tr><th rowspan="2">'+t('students')+'</th>';
  if(ordered.length){h+='<th colspan="'+ordered.length+'" style="background:#ccfbf1">'+t('continuous')+'</th>'}
  h+='<th rowspan="2" style="background:#d1fae5">'+t('continuousTotal')+'</th>';
  if(finals.length){h+='<th colspan="'+finals.length+'" style="background:#fef3c7">'+t('finalExam')+'</th>'}
  else {h+='<th rowspan="2" style="background:#fef3c7">'+t('finalExam')+'</th>'}
  h+='<th rowspan="2" style="background:#e0f2fe">'+t('grandTotal')+'</th></tr><tr>';
  ordered.forEach(a=>{const short=a.name.length>14?a.name.slice(0,12)+'…':a.name;h+='<th style="background:#f0fdfa" title="'+escHTML(a.name)+'">'+escHTML(short)+'<br><small>/'+a.max+'</small></th>'});
  if(finals.length){finals.forEach(a=>{const short=a.name.length>14?a.name.slice(0,12)+'…':a.name;h+='<th style="background:#fffbeb" title="'+escHTML(a.name)+'">'+escHTML(short)+'<br><small>/'+a.max+'</small></th>'})}
  h+='</tr></thead><tbody>';
  students.forEach(st=>{
    let contSum=0, finalSum=0;
    h+='<tr><td style="text-align:start;font-weight:700">'+escHTML(st.name)+'</td>';
    ordered.forEach(a=>{
      const k=a.id+'_'+st.id; const v=db.grades[k];
      if(v!==undefined)contSum+=parseFloat(v)||0;
      h+='<td><input class="'+(v===undefined?'missing-grade':'')+'" type="number" min="0" max="'+a.max+'" step="0.5" value="'+(v!==undefined?v:'')+'" onchange="setG(\''+a.id+'\',\''+st.id+'\',this.value);loadGrades()"></td>';
    });
    h+='<td style="font-weight:800;color:var(--ok);background:#ecfdf5">'+contSum.toFixed(1)+'</td>';
    if(finals.length){
      finals.forEach(a=>{

    if(/^م$|^#$|تسلسل|^no\.?$|serial/.test(x))return'serial';
    return'';
  };
  for(const raw of lines){
    if(!raw||/^(?:---\s*PAGE|page\s+\d+|قوائم\s*الطلاب|السنة\s*الدراسية|سلطنة|وزارة|مديرية|محافظة|رمز\s*المدرسة|ملخص|SUMMARY)/i.test(raw))continue;
    // Prefer tab/pipe split; also handle single spaces carefully for Arabic school lists
    let cells;
    if(/[\t|]/.test(raw))cells=raw.split(/[\t|]/).map(x=>x.trim()).filter((x,i,a)=>x||i===0);
    else if(/\s{2,}/.test(raw))cells=raw.split(/\s{2,}/).map(x=>x.trim()).filter(Boolean);
    else cells=[raw];
    // Drop empty leading cells
    while(cells.length&&!cells[0])cells.shift();

    const types=cells.map(fieldType);const found=types.filter(t=>t&&t!=='serial');
    if((found.includes('name')&&(found.includes('studentNumber')||found.includes('phone')||found.includes('city')))||
       (/الاسم/.test(raw)&&(/الرقم\s*المدرسي|هاتف|المنطقة/.test(raw)))){
      header=types;
      // if first col is serial marker keep it
      continue;
    }

    let rec={name:'',phone:'',studentNumber:'',city:'',village:'',nationality:'',status:''};

    if(header&&cells.length>=2){
      // Align: if header starts with serial and first cell is a short number, map 1:1
      let h=header.slice();let c=cells.slice();
      if(h[0]==='serial'&&/^\d{1,3}$/.test(c[0])){/* keep */}
      else if(h[0]==='serial'&&!/^\d{1,3}$/.test(c[0])){h=h.slice(1)}
      else if(h[0]!=='serial'&&/^\d{1,3}$/.test(c[0])){c=c.slice(1)}
      const n=Math.min(h.length,c.length);
      for(let i=0;i<n;i++){
        const k=h[i];const v=(c[i]||'').trim();
        if(!k||k==='serial'||!v)continue;
        if(k==='name')rec.name=v;
        else if(k in rec)rec[k]=v;
      }
    }

    // Fallback structured Omani row: [serial?] name id nationality status area phone
    if(!rec.name||(!rec.studentNumber&&!rec.phone)){
      let c=cells.slice();
      if(c.length===1){
        // try splitting long single line by digit runs
        const m=c[0].match(/^(\d{1,3})?\s*(.+?)\s+(\d{10,15})\s+(\S+)\s+(\S+)\s+(.+?)\s+(\d{7,12})\s*$/);
        if(m)c=[m[1],m[2],m[3],m[4],m[5],m[6],m[7]].filter(Boolean);
      }
      if(/^\d{1,3}$/.test(c[0]||''))c=c.slice(1);
      if(c.length>=5){
        // name is often the longest Arabic segment at start
        const idIdx=c.findIndex(v=>/^\d{10,15}$/.test(v.replace(/\D/g,'')));
        const phoneIdx=c.findIndex((v,i)=>i!==idIdx&&/^\d{7,12}$/.test(v.replace(/\D/g,'')));
        if(idIdx>0){
          rec.name=c.slice(0,idIdx).join(' ').trim();
          rec.studentNumber=c[idIdx].replace(/\D/g,'');
          if(phoneIdx>=0)rec.phone=c[phoneIdx].replace(/\D/g,'');
          // area: last non-flag Arabic before phone
          for(let i=c.length-1;i>idIdx;i--){
            if(i===phoneIdx)continue;
            const v=c[i];
            if(/^(عماني|منقول|مستجد|منتظم)$/.test(v)){if(!rec.status&&/منقول|مستجد|منتظم/.test(v))rec.status=v;if(!rec.nationality&&/عماني/.test(v))rec.nationality=v;continue}
            if(/[\u0600-\u06FF]/.test(v)&&v.length>=2){rec.city=v;break}
          }
        } else if(c.length>=4){
          rec.name=c[0];
          const digits=c.map(v=>v.replace(/\D/g,'')).filter(d=>d.length>=7);
          if(digits[0]&&digits[0].length>=10)rec.studentNumber=digits[0];
          if(digits[1])rec.phone=digits[1];
          else if(digits[0]&&digits[0].length<=9)rec.phone=digits[0];
        }
      }
    }

    rec={
      name:String(rec.name||'').replace(/^\d+[.\-)]?\s*/,'').trim().replace(/\s+/g,' '),
      phone:String(rec.phone||'').replace(/\D/g,''),
      studentNumber:String(rec.studentNumber||'').replace(/\D/g,''),
      city:String(rec.city||'').trim(),
      village:String(rec.village||'').trim()
    };
    if(rec.name.length>4&&rec.name.length<90&&/[\u0600-\u06FFa-zA-Z]/.test(rec.name)&&
       !/(?:^الاسم$|اسم\s*الطالب|رقم\s*الهاتف|الرقم\s*المدرسي|المنطقة\s*السكن|حالة\s*القيد|الجنسية|student\s*name|phone|قوائم|السنة\s*الدراسية|الصف\s*:|المجموع|total|continuous|semester|grade\s*\d)/i.test(rec.name)){
      records.push(rec);
    }
  }
  const unique=[];const seen=new Set();
  for(const r of records){
    const k=(r.studentNumber&&r.studentNumber.length>=8)?('id:'+r.studentNumber):('n:'+r.name.toLocaleLowerCase());
    if(!seen.has(k)){seen.add(k);unique.push(r)}
  }
  return unique.slice(0,500);
}

function togglePeriodsEdit(){
  const p=document.getElementById('periodsPanel');
  if(!p)return;
  p.style.display=p.style.display==='none'?'block':'none';
}
function applyTimingPreset(val){
  if(!val)return;
  let list=null;
  if(String(val).startsWith('__')) list=BUILTIN_TIMING[val];
  else {
    const i=parseInt(val,10);
    if(!isNaN(i) && db.timingPresets && db.timingPresets[i]) list=db.timingPresets[i].periods;
  }
  if(!list||!list.length)return;
  db.periods=list.map((p,idx)=>({id:idx+1,nameAr:p.nameAr||p.name||('الحصة '+(idx+1)),nameEn:p.nameEn||p.name||('Period '+(idx+1)),time:p.time||'08:00',type:p.type||undefined,endTime:p.endTime||undefined}));
  const pe=document.getElementById('perEdit');
  if(pe){
    pe.innerHTML=db.periods.map((p,i)=>`<div class="per-row"><input value="${periodName(p)}" data-i="${i}" data-f="name" style="flex:1.2"><input type="time" value="${p.time}" data-i="${i}" data-f="time" style="flex:.8"></div>`).join('');
  }
  toast(db.lang==='ar'?'تم تطبيق النموذج — اضغط حفظ':'Preset applied — press Save');
}
function saveCurrentAsTimingPreset(){
  const name=prompt(db.lang==='ar'?'اسم النموذج (مثل: توقيت خاص):':'Preset name:');
  if(!name||!name.trim())return;
  const rows=[];
  document.querySelectorAll('#perEdit [data-i]').forEach(inp=>{
    const i=+inp.dataset.i; const f=inp.dataset.f;
    if(!rows[i]) rows[i]={};
    if(f==='time') rows[i].time=inp.value;
    else { rows[i].nameAr=inp.value; rows[i].nameEn=inp.value; }
  });
  const periods=(rows.length?rows:db.periods).map((p,idx)=>{
    const base=db.periods[idx]||{};
    return {nameAr:p.nameAr||base.nameAr||('الحصة '+(idx+1)),nameEn:p.nameEn||base.nameEn||('Period '+(idx+1)),time:p.time||base.time||'08:00',type:base.type,endTime:base.endTime};
  });
  if(!db.timingPresets) db.timingPresets=[];
  db.timingPresets.push({name:name.trim(),periods});
  save();
  toast(db.lang==='ar'?'تم حفظ النموذج':'Preset saved');
  try{openM('settings')}catch(e){}
}
function deleteSelectedTimingPreset(){
  const sel=document.getElementById('timingPreset');
  if(!sel)return;
  const val=sel.value;
  if(!val||String(val).startsWith('__')) return toast(db.lang==='ar'?'لا يمكن حذف النماذج الافتراضية':'Cannot delete built-in presets');
  const i=parseInt(val,10);
  if(isNaN(i)||!db.timingPresets||!db.timingPresets[i])return;
  if(!confirm(db.lang==='ar'?'حذف هذا النموذج؟':'Delete this preset?'))return;
  db.timingPresets.splice(i,1);
  save();
  toast('✓');
  try{openM('settings')}catch(e){}
}

const seatPickHistory={};
function seatGroupSize(cid){return [2,3,4,5,6].includes(Number(db.seatGroupSizes?.[cid]))?Number(db.seatGroupSizes[cid]):2}
function setSeatGroupSize(cid,size){if(![2,3,4,5,6].includes(size))return;db.seatGroupSizes=db.seatGroupSizes||{};db.seatGroupSizes[cid]=size;selSeat=null;save();drawSeats(cid)}
function drawSeats(cid){
  const grid=document.getElementById('seatGrid');if(!grid)return;
  const students=db.students.filter(s=>String(s.classId)===String(cid));
  const ids=new Set(students.map(s=>String(s.id)));
  const original=db.seating[cid]||[];
  const seats=original.filter(id=>id!==null&&ids.has(String(id)));
  const seen=new Set(seats.map(String));
  students.forEach(st=>{if(!seen.has(String(st.id))){seats.push(st.id);seen.add(String(st.id))}});
  if(JSON.stringify(original)!==JSON.stringify(seats)){db.seating[cid]=seats;save()}
  const size=seatGroupSize(cid);
  document.querySelectorAll('[data-seat-size]').forEach(b=>b.classList.toggle('active',Number(b.dataset.seatSize)===size));
  const groups=[];
  for(let i=0;i<seats.length;i+=size){
    const cells=Array.from({length:size},(_,j)=>{
      const idx=i+j,st=db.students.find(s=>String(s.id)===String(seats[idx]));
      const name=st?st.name.split(/\s+/).slice(0,3).join(' '):'+';
      return `<div class="seat ${st?'':'empty'}" data-seat-index="${idx}" onclick="tapSeat(${idx},'${cid}')" title="${st?escHTML(st.name):''}">${escHTML(name)}</div>`;
    }).join('');
    groups.push(`<div class="seat-table"><div class="seat-table-label">${db.lang==='ar'?'طاولة':'Table'} ${groups.length+1}</div><div class="seat-table-students group-${size}">${cells}</div></div>`);
  }
  grid.innerHTML=groups.join('');
  const result=document.getElementById('pickRes');
  if(result&&seatPickHistory[cid]){
    const done=seatPickHistory[cid].used.length;
    result.dataset.count=String(done);
  }
}
function tapSeat(idx,cid){
  if(selSeat===null){selSeat=idx;document.querySelectorAll('.seat').forEach(s=>s.classList.toggle('selected',Number(s.dataset.seatIndex)===idx));return}
  const seats=db.seating[cid]||[];
  if(idx!==selSeat&&idx<seats.length&&selSeat<seats.length){[seats[selSeat],seats[idx]]=[seats[idx],seats[selSeat]];save()}
  selSeat=null;drawSeats(cid)
}
function shuffleSeats(cid){
  const s=db.seating[cid]||[];
  for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}
  save();selSeat=null;drawSeats(cid);toast('✓')
}
let lotteryRolling=false;
let lotteryAudioContext=null;
function ballTick(final){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!lotteryAudioContext)lotteryAudioContext=new AC();
    const ctx=lotteryAudioContext;
    ctx.resume();
    const t=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(final?540:230,t);
    osc.frequency.exponentialRampToValueAtTime(final?850:130,t+.09);
    gain.gain.setValueAtTime(.045,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.11);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.12);
  }catch(e){}
}
function randPick(cid){
  if(lotteryRolling)return;
  const sts=db.students.filter(s=>String(s.classId)===String(cid));
  if(!sts.length)return toast('—');
  const ids=sts.map(s=>String(s.id)),key=ids.slice().sort().join('|');
  let state=seatPickHistory[cid];
  if(!state||state.key!==key)state=seatPickHistory[cid]={key,used:[]};
  let restarted=false;
  if(state.used.length>=ids.length){state.used=[];restarted=true}
  const available=sts.filter(s=>!state.used.includes(String(s.id)));
  const chosen=available[Math.floor(Math.random()*available.length)];
  const winnerIndex=sts.findIndex(s=>String(s.id)===String(chosen.id));
  lotteryRolling=true;
  const button=document.getElementById('lotteryPickBtn');if(button)button.disabled=true;
  const overlay=document.createElement('div');overlay.className='ball-overlay';overlay.setAttribute('role','dialog');
  const title=document.createElement('h2');title.textContent=db.lang==='ar'?'🏐 من سيكون التالي؟':'🏐 Who is next?';
  const grid=document.createElement('div');grid.className='ball-grid';
  const tiles=sts.map(st=>{const el=document.createElement('div');el.className='ball-name';el.textContent=st.name;grid.appendChild(el);return el});
  const result=document.createElement('div');result.className='ball-result';result.textContent=db.lang==='ar'?'الكرة تتحرك...':'Ball bouncing...';
  const ball=document.createElement('div');ball.className='ball-orb';
  overlay.append(title,grid,result,ball);document.body.appendChild(overlay);
  let step=0,previous=-1;
  const steps=18;
  function move(){
    if(!overlay.isConnected){lotteryRolling=false;if(button)button.disabled=false;return}
    let idx=step===steps-1?winnerIndex:Math.floor(Math.random()*sts.length);
    if(step!==steps-1&&sts.length>1&&idx===previous)idx=(idx+1)%sts.length;
    if(previous>=0)tiles[previous].classList.remove('active');
    tiles[idx].classList.add('active');
    tiles[idx].scrollIntoView({block:'nearest',inline:'nearest'});
    const box=tiles[idx].getBoundingClientRect();
    ball.style.opacity='1';
    ball.style.transform='translate3d('+(box.left+box.width/2-15)+'px,'+(box.top+box.height/2-35)+'px,0)';
    ballTick(false);previous=idx;step++;
    if(step<steps){setTimeout(move,110+Math.round(250*Math.pow(step/steps,2)));return}
    state.used.push(String(chosen.id));
    tiles[idx].classList.remove('active');tiles[idx].classList.add('winner');
    ball.style.opacity='0';ballTick(true);
    const message='🎉 '+chosen.name+' — '+state.used.length+'/'+sts.length+(restarted?' ↻':'');
    result.textContent=message;
    const inline=document.getElementById('pickRes');if(inline)inline.textContent=message;
    const close=document.createElement('button');close.className='ball-continue';close.textContent=db.lang==='ar'?'متابعة':'Continue';
    const finish=()=>{overlay.remove();lotteryRolling=false;if(button)button.disabled=false};
    close.addEventListener('click',finish);overlay.appendChild(close);
    setTimeout(()=>{if(overlay.isConnected)finish()},5500);
  }
  setTimeout(move,200);
}
async function compressImageForStorage(file){
  const bitmap=await createImageBitmap(file);const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return canvas.toDataURL('image/jpeg',0.82)
}

function detectEnglishGrade(text){
  const t=String(text||'');
  if(/GRADE\s*12|الصف\s*12|الثاني\s*عشر/i.test(t)) return 12;
  if(/GRADE\s*11|الصف\s*11|الحادي\s*عشر/i.test(t)) return 11;
  if(/GRADE\s*10|الصف\s*10|العاشر/i.test(t)) return 10;
  if(/GRADE\s*9|الصف\s*9|التاسع/i.test(t)) return 9;
  if(/GRADE\s*[5-8]|الصف\s*[5-8]/i.test(t)) return 9; // use G9 short-test structure for 5–8
  return 0;
}
function englishAssessmentsForGrade(grade){
  const g=Number(grade)||0;
  if(g===12) return englishG12Assessments();
  if(g===11) return englishG11Assessments();
  if(g===10) return englishG10Assessments();
  return englishG9Assessments();
}

function resolveAssessmentPreset(subject,band){
  if(subject==='إنجليزي'){
    const g=band==='12'?12:band==='11'?11:band==='10'?10:9;
    return englishAssessmentsForGrade(g);
  }
  let cat=ASSESSMENT_CATALOG[subject];
  if(!cat)return null;
  let items=cat[band];
  if(typeof items==='string'){
    cat=ASSESSMENT_CATALOG[items];
    items=cat&&cat[band];
  }
  if(!items||!Array.isArray(items))return null;
  return items.map(a=>({name:a.name,max:a.max,type:a.type||'activity'}));
}

function parseEnglishSummaryMarks(text){
  // Parse SAH "SUMMARY of MARKS AWARDED" for G10–12 (PDF text often splits criteria across lines)
  const raw=String(text||'');
  const grade=detectEnglishGrade(raw);
  const clean=normalizeArabicText(normalizeDigits(raw)).replace(/\s+/g,' ').trim();
  const assessments=[];
  const seen=new Set();
  function add(name,type,max){
    const key=name.toLowerCase();
    if(seen.has(key)) return;
    const n=parseInt(max,10);
    if(!Number.isFinite(n)||n<=0||n>100) return;
    seen.add(key);
    assessments.push({name,max:n,type});
  }
  // Ordered flexible patterns: tolerate section labels (SPK/RDG/WRT/G/V) and mid-phrase marks
  const pairs=[
    [/Can\s+give\s+presentations\.?\s*\((\d+)\)/i,'SPK Presentations','activity'],
    [/presentations\.?[^\d]{0,20}\((\d+)\)/i,'SPK Presentations','activity'],
    [/Can\s+interact\s+with\s+others\.?\s*\((\d+)\)/i,'SPK Interaction','activity'],
    [/interact\s+with\s+others\.?[^\d]{0,20}\((\d+)\)/i,'SPK Interaction','activity'],
    [/variety\s+of\s+written[^\d]{0,40}\((\d+)\)[^\d]{0,20}Texts?/i,'RDG Texts','activity'],
    [/understand\s+(?:a\s+)?variety[^\d]{0,60}\((\d+)\)/i,'RDG Texts','activity'],
    [/written\s+texts?\.?[^\d]{0,15}\((\d+)\)/i,'RDG Texts','activity'],
    [/\((\d+)\)[^\d]{0,15}Texts?/i,'RDG Texts','activity'],
    [/purpose\s+of[^\d]{0,20}\((\d+)\)[^\d]{0,20}providing\s+information/i,'WRT Information','activity'],
    [/providing\s+information\.?[^\d]{0,15}\((\d+)\)/i,'WRT Information','activity'],
    [/\((\d+)\)[^\d]{0,25}providing\s+information/i,'WRT Information','activity'],
    [/respond\s+to\s+letters[^\d]{0,20}\((\d+)\)[^\d]{0,20}and\s+e-?mails/i,'WRT Letters','activity'],
    [/letters[^\d]{0,20}\((\d+)\)[^\d]{0,20}and\s+e-?mails/i,'WRT Letters','activity'],
    [/\((\d+)\)[^\d]{0,25}(?:and\s+)?e-?mails/i,'WRT Letters','activity'],
    [/narrate\s+events[^\d]{0,30}\((\d+)\)[^\d]{0,20}in\s+the\s+past/i,'WRT Stories','activity'],
    [/stories\s+and\s+narrate[^\d]{0,40}\((\d+)\)/i,'WRT Stories','activity'],
    [/\((\d+)\)[^\d]{0,30}in\s+the\s+past/i,'WRT Stories','activity'],
    [/express\s+and[^\d]{0,20}\((\d+)\)[^\d]{0,20}justify\s+opinions/i,'WRT Opinions','activity'],
    [/justify\s+opinions\.?[^\d]{0,15}\((\d+)\)/i,'WRT Opinions','activity'],
    [/\((\d+)\)[^\d]{0,25}justify\s+opinions/i,'WRT Opinions','activity'],
    [/use\s+grammar[^\d]{0,20}\((\d+)\)[^\d]{0,20}and\s+vocabulary/i,'G/V Grammar','activity'],
    [/grammar[^\d]{0,30}\((\d+)\)[^\d]{0,20}(?:and\s+)?vocabulary/i,'G/V Grammar','activity'],
    [/\((\d+)\)[^\d]{0,25}and\s+vocabulary/i,'G/V Grammar','activity'],
    [/SEMESTER\s+TEST[^\d]{0,30}\((\d+)\)/i,'Semester Test','exam'],
  ];
  for(const [re,name,type] of pairs){
    const m=clean.match(re);
    if(m) add(name,type,m[1]);
  }
  if(assessments.length>=3){
    if(grade && !seen.has('semester test')){
      const exam=englishAssessmentsForGrade(grade).find(a=>a.type==='exam');
      if(exam) add(exam.name,exam.type,exam.max);
    }
    // Fill any missing continuous criteria from the official preset for that grade
    if(grade){
      englishAssessmentsForGrade(grade).forEach(a=>{
        if(a.type!=='exam' && !seen.has(a.name.toLowerCase())) add(a.name,a.type,a.max);
      });
    }
    const order=['SPK Presentations','SPK Interaction','RDG Texts','WRT Information','WRT Letters','WRT Stories','WRT Opinions','G/V Grammar','Semester Test'];
    assessments.sort((a,b)=>(order.indexOf(a.name)<0?99:order.indexOf(a.name))-(order.indexOf(b.name)<0?99:order.indexOf(b.name)));
    return {grade:grade||10, assessments, pattern:'sah-summary-marks'};
  }
  // Weak match: grade detected + SUMMARY header → use full preset
  if(grade && /SUMMARY\s+of\s+MARKS|CONTINUOUS\s+ASSESSMENT/i.test(clean)){
    return {grade, assessments:englishAssessmentsForGrade(grade), pattern:'sah-grade-preset'};
  }
  return null;
}

function autoFillScheduleFromParsed(parsed){
  const dayMap={'الأحد':0,'الإثنين':1,'الاثنين':1,'الثلاثاء':2,'الأربعاء':3,'الخميس':4,'الجمعة':5,'السبت':6,
    'Sunday':0,'Monday':1,'Tuesday':2,'Wednesday':3,'Thursday':4,'Friday':5,'Saturday':6};
  const classMap={};
  (parsed.classes||[]).forEach(name=>{
    if(!name) return;
    let c=db.classes.find(x=>x.name===name);
    if(!c){ c={id:uid(),name,subject:''}; db.classes.push(c); }
    classMap[name]=c.id;
  });
  (parsed.slots||[]).forEach(sl=>{
    if(!sl.className && !sl.subject) return;
    let classId=null;
    if(sl.className){
      classId=classMap[sl.className];
      if(!classId){
        const c={id:uid(),name:sl.className,subject:sl.subject||''};
        db.classes.push(c); classMap[sl.className]=c.id; classId=c.id;
      }
    } else if(sl.subject){
      // create class from subject if needed - skip orphan subject-only without class
      return;
    }
    let periodId=db.periods.find(p=>p.time===sl.time)?.id;
    if(!periodId && sl.time){
      let best=9999;
      db.periods.forEach(p=>{
        const[h,m]=p.time.split(':').map(Number);
        const[th,tm]=sl.time.split(':').map(Number);
        const diff=Math.abs((h*60+m)-(th*60+tm));
        if(diff<best){best=diff;periodId=p.id;}
      });
    }
    const day=sl.day!==null&&sl.day!==undefined?sl.day:(sl.dayLabel&&dayMap[sl.dayLabel]!==undefined?dayMap[sl.dayLabel]:null);
    if(classId && periodId && day!==null){
      db.schedule=db.schedule.filter(s=>!(s.classId===classId&&s.day===day&&s.periodId===periodId));
      db.schedule.push({classId,day,periodId,subject:sl.subject||db.classes.find(c=>c.id===classId)?.subject||''});
      const cls=db.classes.find(c=>c.id===classId);
      if(cls && sl.subject && !cls.subject) cls.subject=sl.subject;
    }
  });
  db.onboarded=true;
}

function normalizeSubjectLabel(s){
  let t=normalizeArabicText(String(s||'')).replace(/\s+/g,' ').trim();
  if(!t)return '';
  const map=[
    [/الجغرافيا\s*والتقنيات|جغرافيا\s*والتقنيات/i,'الجغرافيا والتقنيات'],
    [/هذا\s*وطني/i,'هذا وطني'],
    [/توجيه\s*مهني/i,'توجيه مهني'],
    [/لغة\s*عربية|عربي(?!\s*ة\s*انج)/i,'لغة عربية'],
    [/تربية\s*إسلامية|إسلامية/i,'تربية إسلامية'],
    [/تربية\s*بدنية|رياضة|بدنية/i,'تربية بدنية'],
    [/إنجليزي|انجليزي|English/i,'إنجليزي'],
    [/رياضيات|Math/i,'رياضيات'],
    [/علوم|Science/i,'علوم'],
    [/دراسات/i,'دراسات'],
    [/حاسوب|حاسب|تقنية\s*معلومات|\bIT\b/i,'حاسوب'],
    [/فيزياء/i,'فيزياء'],
    [/كيمياء/i,'كيمياء'],
    [/أحياء/i,'أحياء'],
    [/تاريخ/i,'تاريخ'],
    [/جغرافيا|Geography/i,'جغرافيا'],
    [/فنون/i,'فنون'],
    [/مهارات/i,'مهارات'],
    [/مواطنة|Civics/i,'مواطنة'],
    [/اجتماعيات/i,'اجتماعيات'],
    [/فلسفة/i,'فلسفة'],
    [/محاسبة/i,'محاسبة'],
    [/اقتصاد/i,'اقتصاد'],
  ];
  for(const [re,name] of map){if(re.test(t))return name}
  return t.slice(0,40);
}
function extractTeacherFromScheduleText(text){
  const t=normalizeArabicText(normalizeDigits(String(text||'')));
  const patterns=[
    /(?:المعلم|المدرس|أستاذ|استاذ|Teacher)\s*[:：]?\s*([^\n\r]{3,40})/i,
    /مدرسة[^\n]{0,40}\n\s*([ء-ي][ء-ي\s]{2,28})/,
  ];
  for(const re of patterns){
    const m=t.match(re);
    if(m){
      let name=m[1].replace(/[0-9a-zA-Z_./\\|-]+/g,' ').replace(/\s+/g,' ').trim();
      name=name.replace(/^(?:الجدول|الحصص|الصفوف|المواد)\s*/,'');
      if(name.length>=4&&name.length<=35&&/[\u0600-\u06FF]{3,}/.test(name)&&!/مدرسة|وادي|الحواسنة|وزارة|تربية|جدول|حصة|فسحة|الأحد|الاثنين/.test(name))
        return name;
    }
  }
  const lines=t.split(/[\n\r]+/).map(l=>l.trim()).filter(Boolean);
  for(let i=0;i<Math.min(lines.length,12);i++){
    const line=lines[i];
    if(/مدرسة|وادي|الحواسنة|ALBATINAH|WADI|aSc|Timetable|تم\s*إنشاء|وزارة/i.test(line)) continue;
    if(/^(?:الأحد|الاحد|الإثنين|الاثنين|الثلاثاء|الأربعاء|الاربعاء|الخميس)/.test(line)) break;
    if(/^[\u0600-\u06FF\s]{4,32}$/.test(line)&&!/[0-9]/.test(line)&&line.split(/\s+/).length<=4)
      return line.replace(/\s+/g,' ').trim();
  }
  return '';
}
async function parseSchedulePdfLayout(file){
  if(!window.pdfjsLib || !file || !(file.type==='application/pdf'||/\.pdf$/i.test(file.name||''))) return null;
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const page=await pdf.getPage(1), content=await page.getTextContent();
  const items=(content.items||[]).filter(x=>String(x.str||'').trim()&&x.transform);
  if(items.length<20) return null;
  const norm=s=>normalizeArabicText(normalizeDigits(String(s||''))).replace(/\s+/g,' ').trim();
  const dayDefs=[['الأحد',0],['الاحد',0],['الإثنين',1],['الاثنين',1],['الثلاثاء',2],['الثلاثا',2],['الأربعاء',3],['الاربعاء',3],['الخميس',4]];
  const dayItems=[];
  for(const it of items){const t=norm(it.str);const d=dayDefs.find(([n])=>t.includes(n));if(d)dayItems.push({day:d[1],y:it.transform[5]});}
  if(!dayItems.some(x=>x.day===0)) return null;
  const timeRe=/([01]?\d|2[0-3])[:.]([0-5]\d)\s*[-–—]\s*([01]?\d|2[0-3])[:.]([0-5]\d)/;
  const headers=[];
  for(const it of items){const m=norm(it.str).match(timeRe);if(m){const start=m[1].padStart(2,'0')+':'+m[2];const end=m[3].padStart(2,'0')+':'+m[4];headers.push({start,end,x:it.transform[4],y:it.transform[5],w:Math.abs(it.width||0)});}}
  const expected=['07:25','08:10','08:55','09:40','10:20','10:40','11:20','12:00','12:40'];
  const centres=[];
  for(const tm of expected){const h=headers.find(x=>x.start===tm);if(h)centres.push({time:tm,x:h.x+h.w/2});}
  if(centres.length<6) return null;
  centres.sort((a,b)=>b.x-a.x);
  const times=expected.slice();
  const yDay=dayItems.map(d=>({day:d.day,y:d.y}));
  const subjTokenRe=/(الجغرافيا\s*والتقنيات|هذا\s*وطني|توجيه\s*مهني|لغة\s*عربية|تربية\s*إسلامية|تربية\s*بدنية|إنجليزي|انجليزي|English|رياضيات|علوم|عربي|إسلامية|دراسات|حاسوب|تقنية|فيزياء|كيمياء|أحياء|تاريخ|جغرافيا|فنون|رياضة|مهارات|مواطنة|اجتماعيات|فلسفة|محاسبة|اقتصاد)/i;
  const subjectItems=[];
  for(const it of items){
    const txt=norm(it.str);
    if(!txt||timeRe.test(txt)||/فسحة|استراحة|aSc|Timetables?|مدرسة|ALBATINAH|WADI|تم\s*إنشاء/i.test(txt)) continue;
    if(/^(?:[A-Da-d]|[أبجد])$/.test(txt)) continue;
    const m=txt.match(subjTokenRe);
    if(m) subjectItems.push({subject:normalizeSubjectLabel(m[0]),x:it.transform[4]+(Math.abs(it.width||0)/2),y:it.transform[5],w:Math.abs(it.width||0)});
  }
  const slots=[],classes=new Set();
  const classRe=/(?:^|[^\d])(1[0-2]|[5-9])(?:$|[^\d])/g;
  for(const it of items){
    const txt=norm(it.str);
    if(!txt||timeRe.test(txt)||/فسحة|استراحة|aSc|Timetables?|مدرسة|ALBATINAH|WADI/i.test(txt)) continue;
    if(subjTokenRe.test(txt)&&!/\d/.test(txt)) continue;
    const matches=[...txt.matchAll(classRe)].map(m=>m[1]); if(!matches.length)continue;
    const x=it.transform[4]+(it.width||0)/2, y=it.transform[5];
    let row=yDay[0],dy=Infinity;for(const d of yDay){const z=Math.abs(d.y-y);if(z<dy){dy=z;row=d;}}
    if(!row||dy>65)continue;
    const width=Math.max(Math.abs(it.width||0),matches.length*12);
    const embedded=normalizeSubjectLabel((txt.match(subjTokenRe)||[])[0]||'');
    matches.forEach((cn,j)=>{
      const tx=matches.length===1?x:(it.transform[4]+width*(j+.5)/matches.length);
      let best=0,dist=Infinity;centres.forEach((c,i)=>{const dd=Math.abs(c.x-tx);if(dd<dist){dist=dd;best=i;}});
      if(dist>58||best===4) return;
      let subject=embedded;
      if(!subject){
        let bestS='',bestD=1e9;
        for(const s of subjectItems){
          const sdy=Math.abs(s.y-y); if(sdy>55) continue;
          const sdx=Math.abs(s.x-tx); if(sdx>70) continue;
          const score=sdx+sdy*0.6;
          if(score<bestD){bestD=score;bestS=s.subject}
        }
        subject=bestS;
      }
      classes.add(cn);
      slots.push({day:row.day,periodIndex:best+1,time:times[best],className:cn,subject:subject||''});
    });
  }
  if(!slots.length)return null;
  const unique=new Map();
  for(const sl of slots){
    const k=[sl.day,sl.periodIndex,sl.className].join('_');
    const prev=unique.get(k);
    if(!prev) unique.set(k,sl);
    else if(sl.subject&&!prev.subject) prev.subject=sl.subject;
  }
  const fullText=items.map(it=>it.str).join('\n');
  const teacherName=extractTeacherFromScheduleText(fullText);
  return {times,slots:[...unique.values()],classes:[...classes],daysPresent:[0,1,2,3,4],pattern:'pdf-position-grid',teacherName};
}

async function handleSchedPdf(input){
  const file=input.files?.[0];if(!file)return;const prev=document.getElementById('importPreview');
  const status=msg=>showImportProgress(prev,msg,file.name||'');

      <p style="font-size:.85rem;font-weight:700;margin-bottom:6px">${t('periodsTimes')}</p>`;
    times.forEach((tm,i)=>{

function applySchedGridImport(){
  const teacherEl=document.getElementById('impTeacherName');
  if(teacherEl){
    const tn=teacherEl.value.trim();
    if(tn){db.teacherName=tn;db.onboarded=true;try{updateHeaderSub()}catch(e){}}
  }
  const nTimes=+(document.getElementById('impTimeCount')?.value||0)||9;
  const newPers=[];
  let teachNum=0;
  for(let i=0;i<nTimes;i++){
    const tm=document.getElementById('impTime'+i)?.value||db.periods[i]?.time||'08:00';
    if(tm==='10:20'||(db.periods[i]&&isBreakPeriod(db.periods[i]))){
      newPers.push({id:i+1,nameAr:'فسحة',nameEn:'Break',time:tm,type:'break',endTime:'10:40'});
    } else {
      teachNum++;
      newPers.push({id:i+1,nameAr:'الحصة '+teachNum,nameEn:'Period '+teachNum,time:tm});
    }
  }
  if(newPers.length) db.periods=newPers;

  // Collect all class names from grid
  const classMap={};
  const ensureClass=(name,subj)=>{
    if(!name) return null;
    // support "9 / 10" → take first for primary, also create both
    const parts=name.split(/[\/,،]+/).map(x=>x.trim()).filter(Boolean);
    let firstId=null;
    parts.forEach(cn=>{
      let c=db.classes.find(x=>x.name===cn||x.name===('الصف '+cn));
      if(!c){
        c={id:uid(),name:cn,subject:subj||''};
        db.classes.push(c);
      } else if(subj){
        // Always prefer subject coming from the timetable grid
        c.subject=subj;
      }
      classMap[cn]=c.id;
      if(!firstId) firstId=c.id;
    });
    return firstId;
  };

  const dayIdxs=[0,1,2,3,4];
  const newSlots=[];
  let classCount=0, restCount=0;
  dayIdxs.forEach(di=>{
    for(let pi=0;pi<nTimes;pi++){
      const clsName=(document.getElementById(`gCls_${di}_${pi}`)?.value||'').trim();
      const subj=(document.getElementById(`gSub_${di}_${pi}`)?.value||'').trim();
      const periodId=pi+1;
      const perObj=db.periods.find(p=>p.id===periodId)||db.periods[pi];
      if(isBreakPeriod(perObj)||(document.getElementById(`gSub_${di}_${pi}`)?.value==='فسحة'&&!clsName)){
        newSlots.push({classId:null,day:di,periodId,subject:t('breakPeriod'),type:'break'});
        continue;
      }
      if(isBreakPeriod(db.periods[pi])){
        newSlots.push({classId:null,day:di,periodId,subject:t('breakPeriod'),type:'break'});
        continue;
      }
      if(!clsName){
        newSlots.push({classId:null,day:di,periodId,subject:t('restPeriod'),type:'rest'});
        restCount++;
        continue;
      }
      const parts=clsName.split(/[\/,،]+/).map(x=>x.trim()).filter(Boolean);
      parts.forEach(cn=>{
        const classId=ensureClass(cn,subj);
        if(!classId) return;
        newSlots.push({classId,day:di,periodId,subject:subj||db.classes.find(c=>c.id===classId)?.subject||''});
        classCount++;
      });
    }
  });
  // Replace full weekday schedule with the grid (classes + rest)
  db.schedule=db.schedule.filter(s=>!(Number(s.day)>=0&&Number(s.day)<=4));
  db.schedule.push(...newSlots);
  db.scheduleView='data';
  db.onboarded=true;
  // Preserve existing class/student-linked records by keeping stable identifiers whenever possible.
  const priorClassByName=new Map(previousClasses.map(c=>[c.name,c.id]));
  for(const c of db.classes){const oldId=priorClassByName.get(c.name);if(oldId){const newId=c.id;c.id=oldId;db.students.forEach(st=>{if(st.classId===newId)st.classId=oldId;});}}
  const priorByNumber=new Map(previousStudents.filter(st=>st.studentNumber).map(st=>[st.studentNumber,st.id]));
  db.students.forEach(st=>{if(priorByNumber.has(st.studentNumber))st.id=priorByNumber.get(st.studentNumber)});
  save();
  closeM();
  go('home');
  toast('✓ '+t('parseOk')+' · '+classCount+' '+(db.lang==='ar'?'حصة':'classes')+' · '+restCount+' '+t('restPeriod'));
}

function applySchedImport(nTimes,nCls){
if(nTimes>0){
  const newPers=[];
  for(let i=0;i<nTimes;i++){
    const tm=document.getElementById('impTime'+i)?.value||db.periods[i]?.time||'08:00';
    newPers.push({id:i+1,nameAr:'الحصة '+(i+1),nameEn:'Period '+(i+1),time:tm});
  }
  if(newPers.length) db.periods=newPers;
}
const classMap={};
for(let i=0;i<nCls;i++){
  const name=document.getElementById('impCls'+i)?.value?.trim();
  const subj=document.getElementById('impSubj'+i)?.value?.trim()||'';
  if(name&&!db.classes.some(c=>c.name===name)){
    const id=uid();
    db.classes.push({id,name,subject:subj});
    classMap[name]=id;
  } else if(name){
    const existing=db.classes.find(c=>c.name===name);
    if(existing){ if(subj&&!existing.subject) existing.subject=subj; classMap[name]=existing.id; }
  }
}
// auto-build schedule from slot rows if present
const slotCount=+document.getElementById('impSlotCount')?.value||0;
const dayMap={'الأحد':0,'الإثنين':1,'الاثنين':1,'الثلاثاء':2,'الأربعاء':3,'الخميس':4,'الجمعة':5,'السبت':6,
  'Sunday':0,'Monday':1,'Tuesday':2,'Wednesday':3,'Thursday':4,'Friday':5,'Saturday':6};
for(let i=0;i<slotCount;i++){
  const clsName=document.getElementById('slotCls'+i)?.value?.trim();
  const subj=document.getElementById('slotSubj'+i)?.value?.trim()||'';
  const time=document.getElementById('slotTime'+i)?.value||'';
  const dayStr=document.getElementById('slotDay'+i)?.value||'';
  if(!clsName) continue;
  let classId=classMap[clsName]||db.classes.find(c=>c.name===clsName)?.id;
  if(!classId){ classId=uid(); db.classes.push({id:classId,name:clsName,subject:subj}); classMap[clsName]=classId; }
  let periodId=db.periods.find(p=>p.time===time)?.id;
  if(!periodId && time){
    // nearest period by time
    periodId=db.periods[0]?.id;
    let best=9999;
    db.periods.forEach(p=>{
      const [h,m]=p.time.split(':').map(Number); const [th,tm]=time.split(':').map(Number);
      const diff=Math.abs((h*60+m)-(th*60+tm));
      if(diff<best){best=diff;periodId=p.id;}
    });
  }
  const normalizedDay=normalizeDigits(dayStr).trim();
  const day=/^[0-6]$/.test(normalizedDay)?Number(normalizedDay):dayMap[dayStr];
  if(periodId&&day!==undefined){
    db.schedule=db.schedule.filter(s=>!(s.classId===classId&&s.day===day&&s.periodId===periodId));
    db.schedule.push({classId,day,periodId,subject:subj||db.classes.find(c=>c.id===classId)?.subject||''});
  }
}
db.onboarded=true;save();closeM();go('classes');toast('✓ '+t('parseOk'));
}

function classifyAssessment(name){
  const x=normalizeArabicText(String(name||'')).toLowerCase();
  if(/المجموع\s*(?:العام|الكلي)?|total\s*score|grand\s*total|الإجمالي/.test(x))return'total';
  if(/مجموع\s*(?:المستمر|التقييم\s*المستمر)|continuous\s*assessment\s*:?\s*total|continuous\s*total/.test(x))return'continuous_total';
  if(/semester\s*test|اختبار\s*(?:نهائي|الفصل|الفصلي)|امتحان\s*نهائي|final\s*exam|نهائي/.test(x))return'exam';
  if(/short\s*test|st\s*#?\s*\d|اختبار\s*قصير|الاختبارات\s*القصيرة|quiz/.test(x))return'quiz';
  if(/listening|استماع/.test(x))return'activity';
  if(/reading|rdg|قراءة/.test(x))return'activity';
  if(/writing|wrt|كتابة/.test(x))return'activity';
  if(/speaking|spk|تحدث|عرض/.test(x))return'activity';
  if(/grammar|vocabulary|grm\s*\/?\s*vcb|g\s*\/\s*v|قواعد|مفردات/.test(x))return'activity';
  if(/الأنشطة|نشاط|فعالية|activity|subactiv|واجب|homework|مشروع|project|مستمر|continuous/.test(x))return'activity';
  return'assessment';
}

    {re:/Can\s+understand\s+and\s+use\s+grammar\s+and\s+vocabulary\.?\s*(?:\((\d+)\))?/gi, kind:'activity', name:'G/V Grammar', max:5},
    {re:/CONTINUOUS\s+ASSESSMENT\s*:?\s*Total\s*(?:\((\d+)\))?/gi, kind:'continuous_total', name:'Continuous Assessment Total', max:40},
    {re:/CONTINUOUS\s+ASSESSMENT\s*(?:\((\d+)\))?/gi, kind:'continuous_total', name:'Continuous Assessment Total', max:40},
    {re:/SEMESTER\s+TEST\s*:?\s*Total\s*(?:\((\d+)\))?/gi, kind:'exam', name:'Semester Test', max:60},
    {re:/SEMESTER\s+TEST\s*(?:\((\d+)\))?/gi, kind:'exam', name:'Semester Test', max:60},
    {re:/TOTAL\s+SCORE\s*(?:\((\d+)\))?/gi, kind:'total', name:'Total Score', max:100},
    // Arabic fallbacks
    {re:/(?:نشاط(?:\s*فرعي)?|النشاط(?:\s*الفرعي)?|الأنشطة\s*الفرعية|subactivity|activity)\s*(?:(?:رقم|no\.?|#)\s*)?([0-9]+|الأول|الأولى|الثاني|الثانية|الثالث|الثالثة)?/gi, kind:'activity'},
    {re:/(?:اختبار\s*قصير|الاختبار\s*القصير|الاختبارات\s*القصيرة|quiz)\s*(?:رقم\s*)?([0-9]+|الأول|الأولى|الثاني|الثانية)?/gi, kind:'quiz'},
    {re:/(?:الاختبار\s*النهائي|اختبار\s*نهائي|امتحان\s*نهائي|final\s*exam)/gi, kind:'exam'},
    {re:/(?:المجموع\s*الكلي|المجموع|الإجمالي|total)/gi, kind:'total'}
  ];
  for(const p of patterns){
    let m; p.re.lastIndex=0;
    while((m=p.re.exec(clean))){
      let label=p.name||m[0].trim().replace(/\s+/g,' ');
      if(!label)continue;
      const maxFromMatch=m[1]&&/^\d+$/.test(m[1])?parseInt(m[1],10):(p.max||null);
      if(!out.some(a=>a.name===label))out.push({name:label,type:p.kind,max:maxFromMatch});
    }
  }
  return out;
}
function splitScoreValues(text){
  const line=normalizeDigits(text);
  const matches=[...line.matchAll(/(^|[^\p{L}])([0-9]{1,3}(?:[.,][0-9]+)?)(?:\s*\/\s*([0-9]{1,3}(?:[.,][0-9]+)?))?/gu)];
  return matches.map(m=>({score:parseFloat(m[2].replace(',','.')),max:m[3]?parseFloat(m[3].replace(',','.')):null}));
}
function parseGradesFromText(text){
  const normalized=normalizeArabicText(normalizeDigits(text));
  const lines=normalized.split(/[\n\r]+/).map(x=>x.trim()).filter(Boolean);
  // Prefer structured English handbook assessment list
  let headerLabels=assessmentLabels(normalized);
  // Deduplicate keeping order
  headerLabels=headerLabels.filter((a,i,arr)=>a.name&&arr.findIndex(x=>x.name===a.name)===i);

  // If handbook structure found (has Continuous + Semester or multiple ST), use it as assessments template
  const hasHandbook=headerLabels.some(a=>/continuous|semester|st1|st2|spk|rdg|wrt/i.test(a.name));
  if(hasHandbook){
    // Exclude pure total rows from editable sub-columns (computed in UI)
    const assessments=headerLabels
      .filter(a=>a.type!=='total'&&a.type!=='continuous_total')
      .map(a=>({
        name:a.name,
        max:Number.isFinite(a.max)?a.max:(a.type==='exam'?40:5),
        type:a.type==='exam'?'exam':(a.type==='quiz'?'quiz':'activity')
      }));
    // Student grade rows if any numeric data present
    const grades=[];
    for(const line of lines){
      if(/SUMMARY|GRADE\s*\d|SEMESTER|CONTINUOUS|Teacher|Class:|Year:/i.test(line))continue;
      const cells=splitImportCells(line);
      if(cells.length<3)continue;
      const nameIndex=cells.findIndex(c=>/[\u0600-\u06FFa-zA-Z]/.test(c)&&c.length>2&&!assessmentLabels(c).length&&!/^\d+$/.test(c));
      if(nameIndex<0)continue;
      const name=cells[nameIndex].replace(/^\d+[.\-)]?\s*/,'').trim();
      const values=[];
      for(let j=nameIndex+1;j<cells.length;j++){
        const vals=splitScoreValues(cells[j]);
        if(vals.length)values.push(...vals);
      }
      if(name.length>=3&&values.length){
        const key=name.toLocaleLowerCase();
        if(!grades.some(g=>g.name.toLocaleLowerCase()===key))
          grades.push({name,scores:values.map(v=>v.score),maxes:values.map(v=>v.max)});
      }
    }
    return{assessments:assessments.slice(0,30),grades:grades.slice(0,500)};
  }

  // Generic table parser (fallback)
  let headerLine=-1;let bestHeaderCount=0;headerLabels=[];
  for(let i=0;i<lines.length;i++){
    const cells=splitImportCells(lines[i]);const labels=[];
    for(const cell of cells){const found=assessmentLabels(cell);if(found.length)labels.push(...found.map(a=>({...a,name:cell.trim()})))}
    const whole=assessmentLabels(lines[i]);
    const hasNameHeader=/(اسم\s*الطالب|الطالب|student\s*name|student)/i.test(lines[i]);
    const candidate=labels.length?labels:whole;
    if(candidate.length>bestHeaderCount&&((candidate.length>=2)||(hasNameHeader&&whole.length>=1))){
      headerLabels=candidate;headerLine=i;bestHeaderCount=candidate.length;
    }
  }
  if(!headerLabels.length)headerLabels=assessmentLabels(normalized);
  headerLabels=headerLabels.filter((a,i,arr)=>a.name&&arr.findIndex(x=>x.name===a.name)===i).slice(0,30);

  const grades=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i];if(i===headerLine)continue;
    if(/اسم\s*الطالب|student\s*name/i.test(line))continue;
    const cells=splitImportCells(line);let name='',values=[];
    if(cells.length>=3){
      const nameIndex=cells.findIndex(c=>/[\u0600-\u06FFa-zA-Z]/.test(c)&&!assessmentLabels(c).length);
      if(nameIndex>=0){
        name=cells[nameIndex].replace(/^\d+[.\-)]?\s*/,'').trim();
        for(let j=nameIndex+1;j<cells.length;j++){
          const vals=splitScoreValues(cells[j]);
          if(vals.length)values.push(...vals);
        }
      }
    }
    if(!values.length){
      const m=line.match(/^\s*(?:[0-9]+[.\-)]\s*)?([\u0600-\u06FFa-zA-Z][\u0600-\u06FFa-zA-Z .’'\-]{2,70}?)\s+((?:[0-9]{1,3}(?:[.,][0-9]+)?\s*(?:\/\s*[0-9]{1,3}(?:[.,][0-9]+)?)?\s*){1,30})$/u);
      if(m){name=m[1].trim();values=splitScoreValues(m[2])}
    }
    if(name.length>=3&&values.length){
      const key=name.toLocaleLowerCase();
      if(!grades.some(g=>g.name.toLocaleLowerCase()===key))
        grades.push({name,scores:values.map(v=>v.score),maxes:values.map(v=>v.max)});
    }
  }
  const maxCols=Math.max(headerLabels.length,...grades.map(g=>g.scores.length),0);
  const assessments=[];
  for(let i=0;i<Math.min(maxCols,30);i++){
    let label=headerLabels[i]?.name||'';
    if(!label){const all=assessmentLabels(normalized);label=all[i]?.name||''}
    if(!label)label=db.lang==='ar'?'درجة '+(i+1):'Score '+(i+1);
    let max=headerLabels[i]?.max;
    if(!Number.isFinite(max)){
      const maxMatch=String(label).match(/\((\d+)\)|\/\s*([0-9]{1,3})/);
      max=maxMatch?parseFloat(maxMatch[1]||maxMatch[2]):null;
    }
    if(!Number.isFinite(max)){
      const vals=grades.map(g=>g.maxes[i]).filter(Number.isFinite);
      if(vals.length)max=Math.max(...vals);
    }
    if(!Number.isFinite(max)){
      const t=classifyAssessment(label);
      max=t==='total'?100:t==='exam'?40:t==='continuous_total'?60:10;
    }
    const t=headerLabels[i]?.type||classifyAssessment(label);
    if(t==='total'||t==='continuous_total')continue; // computed in UI
    assessments.push({name:label,max,type:t==='exam'?'exam':(t==='quiz'?'quiz':'activity')});
  }
  return{assessments,grades:grades.slice(0,500)};
}

function applyGradesImport(classId){
  if(!classId){toast(t('classLabel'));return}
  const nA=+(document.getElementById('gAssessCount')?.value||0);const created=[];
  for(let i=0;i<nA;i++){
    const name=document.getElementById('gAssess'+i)?.value?.trim();
    const max=parseFloat(document.getElementById('gMax'+i)?.value);
    if(!name)continue;
    const type=(document.getElementById('gType'+i)?.value||'quiz');
    // update existing same-name assessment instead of duplicating
    let existing=db.assessments.find(a=>a.classId===classId&&a.name===name);
    if(existing){
      existing.max=Number.isFinite(max)&&max>0?max:existing.max;
      existing.type=type;
      created[i]=existing.id;
    } else {
      const id=uid();
      db.assessments.push({id,classId,name,max:Number.isFinite(max)&&max>0?max:10,type});
      created[i]=id;
    }
  }
  const nG=+(document.getElementById('gGradeCount')?.value||0);
  for(let i=0;i<nG;i++){
    const name=document.getElementById('gName'+i)?.value?.trim();if(!name)continue;
    let st=db.students.find(s=>s.classId===classId&&s.name===name);
    if(!st){st={id:uid(),name,classId};db.students.push(st)}
    for(let j=0;j<nA;j++){
      const assessId=created[j];
      const value=parseFloat(document.getElementById(`gScore${i}_${j}`)?.value);
      if(assessId&&Number.isFinite(value)&&value>=0){const a=db.assessments.find(x=>x.id===assessId);if(!a||value<=Number(a.max))db.grades[assessId+'_'+st.id]=value;}
    }
  }
  db.onboarded=true;save();closeM();go('grades');
  setTimeout(()=>{const sel=document.getElementById('gradeClass');if(sel)sel.value=classId;loadGrades()},50);
  toast('✓ '+t('parseOk')+' ('+created.filter(Boolean).length+')');
}

async function notebookTablePdf_({title,subtitle,headers,rows}){
  // Offline, font-independent PDF: Arabic is shaped by the browser canvas engine.
  const pageW=794,pageH=1123,scale=1.5,margin=42;
  const n=headers.length,landscape=n>5;
  const W=landscape?pageH:pageW,H=landscape?pageW:pageH;
  const available=W-2*margin;
  const nameWidth=Math.min(300,Math.max(180,available*.34));
  const numberWidth=38;
  const otherWidth=(available-nameWidth-numberWidth)/(n-2);
  const widths=headers.map((_,i)=>i===0?numberWidth:i===1?nameWidth:otherWidth);
  const rowH=37,headerY=130,footer=48;
  const pages=[];
  function page(){
    const canvas=document.createElement('canvas');canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);
    const c=canvas.getContext('2d');c.scale(scale,scale);
    c.fillStyle='#fff';c.fillRect(0,0,W,H);
    c.direction='rtl';c.textAlign='right';c.fillStyle='#0f766e';c.font='bold 22px Tahoma, Arial, sans-serif';
    c.fillText(title,W-margin,55);
    c.font='14px Tahoma, Arial, sans-serif';c.fillStyle='#475569';c.fillText(subtitle,W-margin,82);
    c.fillStyle='#0f766e';c.fillRect(margin,headerY,available,rowH);
    let x=margin;
    headers.forEach((h,i)=>{drawCell(c,String(h),x,headerY,widths[i],rowH,true);x+=widths[i]});
    pages.push({canvas,c,y:headerY+rowH});
    return pages[pages.length-1];
  }
  function drawCell(c,value,x,y,w,h,heading){
    c.strokeStyle='#cbd5e1';c.lineWidth=.7;c.strokeRect(x,y,w,h);
    c.save();c.beginPath();c.rect(x+3,y+2,w-6,h-4);c.clip();
    c.fillStyle=heading?'#fff':'#164e49';c.font=(heading?'bold ':'')+'12px Tahoma, Arial, sans-serif';
    c.direction='rtl';c.textAlign='right';
    let text=String(value),max=w-12;
    while(text.length>1&&c.measureText(text).width>max)text=text.slice(0,-2)+'…';
    c.fillText(text,x+w-6,y+h/2+5);c.restore();
  }
  let current=page();
  for(const row of rows){
    if(current.y+rowH>H-footer)current=page();
    let x=margin;
    row.forEach((value,i)=>{drawCell(current.c,value,x,current.y,widths[i],rowH,false);x+=widths[i]});
    current.y+=rowH;
  }
  const jpgs=pages.map((p,i)=>{
    p.c.fillStyle='#64748b';p.c.font='12px Arial';p.c.textAlign='center';p.c.direction='ltr';
    p.c.fillText((i+1)+' / '+pages.length,W/2,H-23);
    const base64=p.canvas.toDataURL('image/jpeg',.88).split(',')[1];
    const binary=atob(base64),bytes=new Uint8Array(binary.length);
    for(let j=0;j<binary.length;j++)bytes[j]=binary.charCodeAt(j);
    return {bytes,width:p.canvas.width,height:p.canvas.height};
  });
  const enc=new TextEncoder(),chunks=[],offsets=[0];let pos=0;
  function add(b){chunks.push(b);pos+=b.length}
  function ascii(s){add(enc.encode(s))}
  ascii('%PDF-1.4\n');
  const total=2+jpgs.length*3;
  function obj(id,body){offsets[id]=pos;ascii(id+' 0 obj\n'+body+'\nendobj\n')}
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+jpgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+jpgs.length+' >>');
  jpgs.forEach((j,i)=>{
    const pageId=3+i*3,imgId=pageId+1,contentId=pageId+2;
    obj(pageId,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im'+i+' '+imgId+' 0 R >> >> /Contents '+contentId+' 0 R >>');
    offsets[imgId]=pos;
    ascii(imgId+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+j.width+' /Height '+j.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.bytes.length+' >>\nstream\n');
    add(j.bytes);ascii('\nendstream\nendobj\n');
    const commands='q\n'+W+' 0 0 '+H+' 0 0 cm\n/Im'+i+' Do\nQ\n';
    offsets[contentId]=pos;
    ascii(contentId+' 0 obj\n<< /Length '+enc.encode(commands).length+' >>\nstream\n'+commands+'endstream\nendobj\n');
  });
  const start=pos;
  ascii('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(let i=1;i<=total;i++)ascii(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  ascii('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}

function periodEndMinutes(per){
