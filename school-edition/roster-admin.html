<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>إدارة أسماء المعلمين</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--green:#075c4e;--gold:#b99549}*{box-sizing:border-box}body{font:16px system-ui,Tahoma;background:linear-gradient(145deg,#e6f3eb,#fffaf0 65%,#eee0bd);color:#164b40;margin:0;min-height:100vh}main{max-width:900px;margin:26px auto;padding:20px}section{background:#fff;border:1px solid #e5d2a8;border-radius:19px;padding:22px;margin:15px 0;box-shadow:0 6px 22px #134b3217}h1{font-size:clamp(1.5rem,4vw,2rem);color:var(--green)}h2{color:var(--green)}a{color:var(--green)}button{padding:11px;border:1px solid #c4a363;border-radius:10px;background:var(--green);color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.num{font-size:2rem;font-weight:bold;color:var(--green)}li{padding:12px;border-bottom:1px solid #eee;display:flex;gap:12px;flex-wrap:wrap;align-items:center}@media(max-width:600px){main{margin:0;padding:12px}section{padding:16px}table{font-size:.86rem}}</style><main><a href="founder-dashboard.html">لوحة المشرف</a><h1>إدارة أسماء المعلمين</h1><section><div id="google"></div><p id="status">سجّل الدخول كمشرف.</p><ul id="list"></ul></section></main><script src="./session-auth.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script>
let token='';const el=id=>document.getElementById(id);
async function call(action,extra={}){const r=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-roster-admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:token,action,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw Error('تعذر تنفيذ العملية');return j.data}
async function load(){try{const rows=await call('list');el('list').replaceChildren(...rows.map(x=>{const li=document.createElement('li'),b=document.createElement('button'),name=document.createElement('span');name.textContent=(x.schoolId==='boys'?'البنين':'البنات')+' — '+x.name+(x.sharedWith?' (مشترك)':'');b.textContent='تعديل';b.onclick=async()=>{const n=prompt('الاسم الجديد',x.name);if(!n||n===x.name)return;try{await call('rename',{teacherId:x.id,name:n});load()}catch{el('status').textContent='تعذر تعديل الاسم'}};li.append(name,b);return li}));el('status').textContent='تم تحميل القائمة.'}catch{el('status').textContent='غير مصرح أو تعذر الاتصال'}}
function onGoogle(r){if(!r?.credential)return;token=r.credential;schoolAuthSave(token);el('google').closest('section').querySelector('#status').textContent='جارٍ تحميل أسماء المعلمين...';el('google').style.display='none';load()}
let i=0;const t=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(t);google.accounts.id.initialize({client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});if(!token)google.accounts.id.renderButton(el('google'),{theme:'outline',size:'large'})}else if(++i>50)clearInterval(t)},200);
const saved=schoolAuthRestore();if(saved)onGoogle({credential:saved});</script></html>
