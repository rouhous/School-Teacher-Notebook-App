<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>إدارة أسماء المعلمين</title><style>body{font:16px system-ui;background:#eff8f2;color:#064e43}main{max-width:680px;margin:auto;padding:24px}section{background:white;border:2px solid #c4a04d;border-radius:16px;padding:20px}button{padding:8px;margin:6px;background:#08705f;color:white;border:0;border-radius:7px}li{padding:8px;border-bottom:1px solid #ddd}</style><main><a href="founder-dashboard.html">لوحة المشرف</a><h1>إدارة أسماء المعلمين</h1><section><div id="google"></div><p id="status">سجّل الدخول كمشرف.</p><ul id="list"></ul></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
let token='';const el=id=>document.getElementById(id);
async function call(action,extra={}){const r=await fetch('https://czljzhwmtqmtmlsbwgyz.supabase.co/functions/v1/school-roster-admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:token,action,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw Error('تعذر تنفيذ العملية');return j.data}
async function load(){try{const rows=await call('list');el('list').replaceChildren(...rows.map(x=>{const li=document.createElement('li'),b=document.createElement('button'),name=document.createElement('span');name.textContent=(x.schoolId==='boys'?'البنين':'البنات')+' — '+x.name+(x.sharedWith?' (مشترك)':'');b.textContent='تعديل';b.onclick=async()=>{const n=prompt('الاسم الجديد',x.name);if(!n||n===x.name)return;try{await call('rename',{teacherId:x.id,name:n});load()}catch{el('status').textContent='تعذر تعديل الاسم'}};li.append(name,b);return li}));el('status').textContent='تم تحميل القائمة.'}catch{el('status').textContent='غير مصرح أو تعذر الاتصال'}}
function onGoogle(r){token=r.credential;load()}
let i=0;const t=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(t);google.accounts.id.initialize({client_id:'825380653679-u542mtddqblq5nrt0pctj8sbfe9sg4dj.apps.googleusercontent.com',callback:onGoogle});google.accounts.id.renderButton(el('google'),{theme:'outline',size:'large'})}else if(++i>50)clearInterval(t)},200);
</script></html>
