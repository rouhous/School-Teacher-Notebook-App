name: Validate Noor 2.8.38 Omani interactive SCORM (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - "addons/unified/Noor-Unified-v2.8.38-OmaniSCORM-source.zip"
      - ".github/workflows/build-unified-noor-addon.yml"
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract and verify integration
        run: |
          set -euo pipefail
          mkdir -p extension
          unzip -q addons/unified/Noor-Unified-v2.8.38-OmaniSCORM-source.zip -d extension
          test -f extension/manifest.json
          test -f extension/noor-license.js
          test -f extension/noor-license-ui.js
          grep -Fq 'stnNoorEntitlement:v1' extension/noor-license.js
          grep -Fq 'STN_LICENSE_STATUS' extension/noor-license-ui.js
          grep -Fq 'stnHubPrepSaveMode' extension/noor-hub.js
          grep -Fq 'saveReviewedPreparation({automatic:true})' extension/noor-hub.js
          test -f extension/noor-hub.js
          test -f extension/noor-lesson-numbers.js
          grep -Fq 'stnNoorSelectedService:v2' extension/noor-hub.js
          grep -Fq 'resolveVerifiedLesson' extension/noor-hub.js
          test -f extension/noor-scorm.js
          test -f extension/smart-background.js
          test -f extension/smart/src/noor-automator.js
          test -f extension/smart/src/noor-panel.js
          test ! -e extension/lessons.js
          test ! -e extension/META-INF/mozilla.rsa
          node -e "const fs=require('fs'),m=require('./extension/manifest.json');if(m.version!=='2.8.38'||m.browser_specific_settings.gecko.id!=='noor-prep-filler-private-2026@rouhous.github.io'||!m.browser_specific_settings.gecko.update_url)process.exit(1);for(const s of [...m.background.scripts,...m.content_scripts.flatMap(c=>[...c.js,...(c.css||[])])])if(!fs.existsSync('extension/'+s))process.exit(1)"
          find extension -name '*.js' -not -name 'pdf.min.js' -not -name 'pdf.worker.min.js' -not -name 'mammoth.browser.min.js' -print0 | xargs -0 -n1 node --check
          grep -Fq 'stnGeminiKey:' extension/smart-background.js
          grep -Fq 'NOOR_ACTIVITY_GEMINI_GENERATE' extension/smart-background.js
          grep -Fq 'LMSSetValue' extension/noor-scorm.js
          grep -Fq 'stnCourseCatalog:v4:' extension/noor-course-catalog.js
          test ! -e extension/noor-pipeline.js
          test ! -e extension/noor-pipeline-background.js
          grep -Fq 'stnHubSubject' extension/noor-hub.js
          grep -Fq 'stnHubPrepScope' extension/noor-hub.js
          grep -Fq 'stnHubActivityQuantity' extension/noor-hub.js
          grep -Fq 'stnHubScormQuantity' extension/noor-hub.js
          grep -Fq 'publishSelection' extension/smart/src/noor-panel.js
          grep -Fq 'stnHubDragHandle' extension/noor-hub.js
          grep -Fq 'stnHubTransfer:v2' extension/noor-hub.js
          grep -Fq 'verifiedClassFromDashboard' extension/smart/src/noor-panel.js
          grep -Fq 'classMatchesForRun' extension/smart/src/noor-automator.js
          test -f extension/noor-gemini-models.js
          grep -Fq 'gemini-3.5-flash-lite' extension/noor-gemini-models.js
          grep -Fq 'r.status===503' extension/noor-gemini-models.js
          grep -Fq 'setTimeout(resolve,ms)' extension/noor-gemini-models.js
          grep -Fq 'NoorGeminiModels.generate' extension/smart-background.js
          grep -Fq 'NoorGeminiModels.generate' extension/gemini-background.js
          grep -Fq 'NoorGeminiModels.generate' extension/gemini-background.js
          node -e "const m=require('./extension/manifest.json');if(m.background.scripts[0]!=='noor-license.js'||m.background.scripts[1]!=='noor-gemini-models.js')process.exit(1)"
          if grep -Fq "value='gemini-2.5-flash-lite'" extension/smart/src/noor-panel.js; then exit 1; fi
      - name: Test verified numeric unit and lesson resolution
        run: |
          node - <<'NODE'
          require('./extension/noor-lesson-numbers.js');
          const a=globalThis.NoorLessonNumbers;
          if (!a) throw Error('Noor numeric resolver missing');
          const units=[{term:'الفصل الأول',termId:'t1',unitId:'u4',unit:'Unit4: Civilisation',
             lessons:[{id:'l4',title:'Unit4: Civilisation: Lesson4'}]},
             {term:'الفصل الثاني',termId:'t2',unitId:'u4b',unit:'Unit4: Civilisation',
             lessons:[{id:'l4b',title:'Unit4: Civilisation: Lesson4'}]}];
          const r=a.resolve(units,{semester:'1',unit:'4',lesson:'4'});
          if(!r.ok||r.lessonId!=='l4')throw Error('Unit4 Lesson4 should resolve uniquely in semester 1');
          if(a.resolve(units,{semester:'',unit:'4',lesson:'4'}).reason!=='ambiguous')throw Error('Must reject ambiguous semester');
          const theme=a.resolve([{term:'First',termId:'t',unitId:'u',unit:'Theme4: Travel and Transport',
            lessons:[{id:'l',title:'Unit 4: Jobs in Airports and Aviation'}]}],
            {semester:'1',unit:'4',lesson:'4'});
          if(!theme.ok||theme.lessonId!=='l')throw Error('Theme4 child Unit4 must resolve as numbered lesson');
          if(a.resolve(units,{semester:'1',unit:'4',lesson:'9'}).ok)throw Error('Missing lesson must not match');
          console.log('Numeric unit and lesson mapping safeguards passed');
          NODE
      - name: Verify Oman learning quest SCORM renderer and dedicated Gemini request
        run: |
          grep -Fq 'NOOR_GEMINI_SCORM_GENERATE' extension/gemini-background.js
          grep -Fq 'NOOR_GEMINI_SCORM_GENERATE' extension/noor-hub.js
          grep -Fq 'matchQuestion' extension/noor-scorm.js
          grep -Fq 'orderQuestion' extension/noor-scorm.js
          grep -Fq 'three stages' extension/gemini-background.js
          node - <<'NODE'
          const vm=require('vm'),fs=require('fs');
          const c={Blob,TextEncoder,Uint8Array,Math,Array,Number,Object,String,Set,Error};
          c.globalThis=c;vm.runInNewContext(fs.readFileSync('extension/noor-scorm.js','utf8'),c);
          const qs=[{type:'mcq',question:'Which is an Omani sailing boat?',options:['Dhow','Rocket','Bus','Train'],correct:0,explanation:'A dhow is a sailing boat.'},
           {type:'truefalse',question:'Traditional forts are part of Omani history.',correct:0,explanation:'Forts are historical buildings.'},
           {type:'order',question:'Put the story steps into order.',items:['Plan','Write','Review'],explanation:'Start by planning.'},
           {type:'match',question:'Match the vocabulary to the meanings.',pairs:[{left:'Dhow',right:'Boat'},{left:'Fort',right:'Building'},{left:'Sea',right:'Water'}],explanation:'Each term matches its meaning.'}];
          if(c.NoorScorm.normalize(qs).length!==4)throw Error('four challenge types missing');
          c.NoorScorm.create('Unit 1 • Lesson 1',{questions:qs,intro:'Explore Oman',mission:'Complete the stages'},{subject:'English',grade:10,unit:'Unit1: Stories',lesson:'Lesson1'}).arrayBuffer()
           .then(buf=>{if(!c.NoorScorm.hasManifest(buf)||buf.byteLength<4000)process.exitCode=1;else console.log('Omani offline SCORM package verified')})
           .catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Package unsigned XPI for Mozilla signing
        run: |
          set -euo pipefail
          cd extension
          zip -q -r ../Noor-Unified-v2.8.38-unsigned.xpi . -x 'README.md' '*.DS_Store'
          cd ..
          unzip -t Noor-Unified-v2.8.38-unsigned.xpi | tail -1
          if unzip -Z1 Noor-Unified-v2.8.38-unsigned.xpi | grep -q 'lessons.js'; then exit 1; fi
          sha256sum Noor-Unified-v2.8.38-unsigned.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: Noor-Unified-v2.8.38-unsigned-for-Mozilla
          path: Noor-Unified-v2.8.38-unsigned.xpi
          retention-days: 30
