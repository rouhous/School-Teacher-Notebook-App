name: Build integrated Noor Firefox extension 2.8.26 (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - "addons/unified/Noor-Unified-v2.8.26-Integrated-source.zip"
      - ".github/workflows/build-unified-noor-addon.yml"
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract and verify integration
        run: |
          set -euo pipefail
          mkdir -p extension
          unzip -q addons/unified/Noor-Unified-v2.8.26-Integrated-source.zip -d extension
          test -f extension/manifest.json
          test -f extension/noor-hub.js
          test -f extension/noor-scorm.js
          test -f extension/smart-background.js
          test -f extension/smart/src/noor-automator.js
          test -f extension/smart/src/noor-panel.js
          test ! -e extension/lessons.js
          test ! -e extension/META-INF/mozilla.rsa
          node -e "const fs=require('fs'),m=require('./extension/manifest.json');if(m.version!=='2.8.26'||m.browser_specific_settings.gecko.id!=='noor-prep-filler-private-2026@rouhous.github.io'||!m.browser_specific_settings.gecko.update_url)process.exit(1);for(const s of [...m.background.scripts,...m.content_scripts.flatMap(c=>[...c.js,...(c.css||[])])])if(!fs.existsSync('extension/'+s))process.exit(1)"
          find extension -name '*.js' -not -name 'pdf.min.js' -not -name 'pdf.worker.min.js' -not -name 'mammoth.browser.min.js' -print0 | xargs -0 -n1 node --check
          grep -Fq 'stnGeminiKey:' extension/smart-background.js
          grep -Fq 'NOOR_ACTIVITY_GEMINI_GENERATE' extension/smart-background.js
          grep -Fq 'LMSSetValue' extension/noor-scorm.js
      - name: Package unsigned XPI for Mozilla signing
        run: |
          set -euo pipefail
          cd extension
          zip -q -r ../Noor-Unified-v2.8.26-unsigned.xpi . -x 'README.md' '*.DS_Store'
          cd ..
          unzip -t Noor-Unified-v2.8.26-unsigned.xpi | tail -1
          if unzip -Z1 Noor-Unified-v2.8.26-unsigned.xpi | grep -q 'lessons.js'; then exit 1; fi
          sha256sum Noor-Unified-v2.8.26-unsigned.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: Noor-Unified-v2.8.26-unsigned-for-Mozilla
          path: Noor-Unified-v2.8.26-unsigned.xpi
          retention-days: 30
