name: Build clean unified Noor Firefox extension (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - "addons/unified/Noor-Unified-v2.8.25-Simplified-source.zip"
      - ".github/workflows/build-unified-noor-addon.yml"
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract and verify clean source
        run: |
          set -euo pipefail
          mkdir -p extension
          unzip -q addons/unified/Noor-Unified-v2.8.25-Simplified-source.zip -d extension
          test -f extension/manifest.json
          test -f extension/notebook-bridge.js
          test -f extension/teacher-profile.js
          test -f extension/unified-panel.js
          test ! -e extension/lessons.js
          grep -Fq 'AQ\.' extension/gemini-background.js
          grep -Fq "NOOR_GEMINI_TEST_KEY" extension/gemini-background.js
          if grep -Fq 'functions/v1/noor-generate-prep' extension/gemini-background.js; then echo 'Old prep relay found'; exit 1; fi
          test ! -e extension/META-INF/mozilla.rsa
          grep -Fq "activeTreeLesson" extension/page-helper.js
          grep -Fq "noor-context-semester" extension/content.js
          grep -Fq "noor-key-setup" extension/content.js
          grep -Fq "noor-prep-primary-actions" extension/content.js
          node -e "const m=require('./extension/manifest.json');if(m.version!=='2.8.25'||!m.browser_specific_settings.gecko.update_url||m.browser_specific_settings.gecko.id!=='noor-prep-filler-private-2026@rouhous.github.io'||m.content_scripts.some(s=>s.js.includes('lessons.js')))process.exit(1)"
          for p in extension/content.js extension/gemini-background.js extension/notebook-bridge.js extension/teacher-profile.js extension/unified-panel.js extension/page-helper.js; do
            node --check "$p"
          done
          grep -Fq "noor_prepared_titles_v1" extension/content.js
          grep -Fq "localStorage.removeItem(key)" extension/content.js
      - name: Package unsigned XPI for Mozilla signing
        run: |
          set -euo pipefail
          cd extension
          zip -q -r ../Noor-Unified-v2.8.25-Simplified-unsigned.xpi . -x 'README.md' '*.DS_Store'
          cd ..
          unzip -t Noor-Unified-v2.8.25-Simplified-unsigned.xpi | tail -1
          if unzip -Z1 Noor-Unified-v2.8.25-Simplified-unsigned.xpi | grep -q 'lessons.js'; then exit 1; fi
          sha256sum Noor-Unified-v2.8.25-Simplified-unsigned.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: Noor-Unified-v2.8.25-Simplified-unsigned-for-Mozilla-signing
          path: Noor-Unified-v2.8.25-Simplified-unsigned.xpi
          retention-days: 30
