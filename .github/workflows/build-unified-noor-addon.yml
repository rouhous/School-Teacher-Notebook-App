name: Package unified Noor Firefox extension (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - "addons/unified/Noor-Unified-v2.8.22-source.zip"
      - ".github/workflows/build-unified-noor-addon.yml"
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Expand source archive
        run: |
          set -euo pipefail
          mkdir -p extension
          unzip -q addons/unified/Noor-Unified-v2.8.22-source.zip -d extension
          test -f extension/manifest.json
          test -f extension/notebook-bridge.js
          test -f extension/teacher-profile.js
          test -f extension/unified-panel.js
          test ! -e extension/META-INF/mozilla.rsa
          node -e "const m=require('./extension/manifest.json'); if(m.version!=='2.8.22'||!m.browser_specific_settings.gecko.update_url||m.browser_specific_settings.gecko.id!=='noor-prep-filler-private-2026@rouhous.github.io')process.exit(1)"
          for p in extension/content.js extension/gemini-background.js extension/notebook-bridge.js extension/teacher-profile.js extension/unified-panel.js; do
            node --check "$p"
          done
      - name: Make development XPI — unsigned, not a permanent Firefox install
        run: |
          set -euo pipefail
          cd extension
          zip -q -r ../Noor-Unified-v2.8.22-unsigned.xpi . -x 'README.md' '*.DS_Store'
          cd ..
          unzip -t Noor-Unified-v2.8.22-unsigned.xpi | tail -1
          sha256sum Noor-Unified-v2.8.22-unsigned.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: Noor-Unified-v2.8.22-unsigned-for-Mozilla-signing
          path: Noor-Unified-v2.8.22-unsigned.xpi
          retention-days: 30
