name: Sign and publish Noor Firefox extension

on:
  workflow_dispatch:
  push:
    paths:
      - 'addons/files/Noor-Unified-v*-UNSIGNED.xpi'

permissions:
  contents: write

concurrency:
  group: noor-firefox-signing
  cancel-in-progress: false

jobs:
  sign-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Mozilla signing credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_JWT_ISSUER" && test -n "$AMO_JWT_SECRET" || {
            echo "::error::Add AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets."; exit 1;
          }
      - name: Prepare unsigned extension
        id: version
        run: |
          set -euo pipefail
          SOURCE=$(find addons/files -maxdepth 1 -name 'Noor-Unified-v*-UNSIGNED.xpi' | sort -V | tail -1)
          test -n "$SOURCE"
          mkdir -p /tmp/noor-addon /tmp/noor-signed
          unzip -q "$SOURCE" -d /tmp/noor-addon
          rm -rf /tmp/noor-addon/META-INF
          VERSION=$(node -p 'require("/tmp/noor-addon/manifest.json").version')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Sign through Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@latest sign --source-dir /tmp/noor-addon --artifacts-dir /tmp/noor-signed --channel unlisted --approval-timeout 600000
      - name: Publish signed XPI and Firefox update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SIGNED=$(find /tmp/noor-signed -maxdepth 1 -name '*.xpi' | head -1)
          test -s "$SIGNED"
          TARGET="addons/files/Noor-Unified-v${VERSION}-signed.xpi"
          cp "$SIGNED" "$TARGET"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('addons/updates.json')
          data=json.loads(path.read_text()) if path.exists() else {'addons':{}}
          addon='noor-prep-filler-private-2026@rouhous.github.io'
          version=os.environ['VERSION']
          uri=f'https://rouhous.github.io/School-Teacher-Notebook-App/addons/files/Noor-Unified-v{version}-signed.xpi'
          entry=data.setdefault('addons',{}).setdefault(addon,{})
          updates=[u for u in entry.get('updates',[]) if u.get('version')!=version]
          updates.append({'version':version,'update_link':uri})
          entry['updates']=updates
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET" addons/updates.json
          git diff --cached --quiet || (git commit -m "Sign and publish Noor Unified v${VERSION}" && git push)
