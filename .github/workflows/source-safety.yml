name: Production source safety checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required entrypoints and ownership notice
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s school-edition/school-notebook.html
          test -s school-edition/session-auth.js
          test -s LICENSE
          grep -q 'Houssem Lotfi Rouatbi' LICENSE
          grep -q 'Houssem Lotfi Rouatbi' index.html
      - name: Check for high-risk credential patterns in deployed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = {
            'Supabase service role JWT marker': re.compile(r'eyJ[A-Za-z0-9_-]{20,}\\.eyJ[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{15,}'),
            'Private key block': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }
          failures = []
          for path in Path('.').rglob('*'):
            if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.html','.js','.mjs','.json','.yml','.yaml','.env'}:
              continue
            if path.stat().st_size > 2_000_000:
              continue
            content = path.read_text(encoding='utf-8',errors='replace')
            for name,pattern in patterns.items():
              if pattern.search(content):
                failures.append(f'{path}: potential {name}')
          if failures:
            print('\\n'.join(failures))
            sys.exit(1)
          print('Basic deployed-source credential-pattern scan passed.')
          PY
