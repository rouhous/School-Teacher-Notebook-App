name: Import working notebook foundation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-legacy.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy original notebook without changing source
        run: |
          mkdir -p school-edition
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/rouhous/Teacher-notebook/main/index.html' -o school-edition/notebook-core.html
          test $(wc -c < school-edition/notebook-core.html) -gt 100000
      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-edition/notebook-core.html
          git diff --cached --quiet || (git commit -m 'Import working notebook core from original repository' && git push)
