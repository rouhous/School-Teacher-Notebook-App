name: Build Android Teacher Widget
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || exit 1
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore persistent signing key when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-widget/app/teacher-notebook-release.jks
            echo "Persistent signing key restored securely."
          else
            echo "No persistent signing key configured; debug APK only."
          fi
      - name: Print persistent signing fingerprint when configured
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -f android-widget/app/teacher-notebook-release.jks ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            keytool -list -v -keystore android-widget/app/teacher-notebook-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA1:|SHA256:'
          else
            echo "Persistent SHA-1 unavailable until signing secrets are configured."
          fi
      - name: Build debug APK
        working-directory: android-widget
        run: gradle --no-daemon assembleDebug
      - name: Print APK signing certificate fingerprints
        working-directory: android-widget
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          echo "NOTE: The debug signing key may differ across GitHub-hosted runners. Do not register this fingerprint as a permanent production OAuth identity."
      - uses: actions/upload-artifact@v4
        with:
          name: School-Teacher-Notebook-Android-debug
          path: android-widget/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
