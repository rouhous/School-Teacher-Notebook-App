name: Diagnose Noor class discovery and SCORM flow
on:
  push:
    paths:
      - ".github/workflows/diagnose-noor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published baseline and inspect shared class resolver
        shell: bash
        run: |
          set -euo pipefail
          mkdir ext
          curl -fsSL "https://raw.githubusercontent.com/rouhous/School-Teacher-Notebook-App/main/addons/files/Noor-Unified-v2.8.120-signed.xpi" -o /tmp/noor.xpi
          unzip -q /tmp/noor.xpi -d ext
          mkdir -p /tmp/noor-source
          cp ext/noor-class-card.js ext/noor-course-catalog.js ext/noor-hub.js ext/noor-scorm-publisher.js ext/noor-attachment-publisher.js ext/noor-scorm.js /tmp/noor-source/
          cd /tmp/noor-source && zip -q /tmp/noor-source.zip *.js
          cd "$GITHUB_WORKSPACE"
          echo "=== Upload exact runtime sources as diagnostic artifact ==="
          echo "=== manifest scripts ==="
          node -e "const m=require('./ext/manifest.json');console.log((m.content_scripts||[]).map(x=>x.js))"
          echo "=== source files ==="
          find ext -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort
          echo "=== map call sites in Noor runtime (excluding vendor) ==="
          grep -nF '.map(' ext/noor-*.js | head -100 || true
          echo "=== FULL CLASS CARD ENGINE ==="
          sed -n '1,180p' ext/noor-class-card.js
          echo "=== COURSE CATALOG ROUTE DISCOVERY ==="
          sed -n '1,330p' ext/noor-course-catalog.js
          echo "=== HUB COURSE SELECTION AND NAVIGATION ==="
          sed -n '520,700p' ext/noor-hub.js
          echo "=== ATTACHMENT PUBLISHER FLOW ==="
          sed -n '1,190p' ext/noor-attachment-publisher.js
          echo "=== class / CID / SCORM navigation call sites ==="
          grep -nEi 'openClass|openCard|resolveClass|classCard|courseId|course_id|CID|scorm|teacher/homeworks|location\\.(assign|href)' ext/noor-*.js | head -220 || true
          echo "=== attachment publisher class resolver ==="
          grep -n -A45 -B15 -E 'function.*(Class|Card)|const .*CID|courseId|course_id' ext/noor-attachment-publisher.js | head -240 || true
          echo "=== SCORM source files and resolver references ==="
          grep -n -A35 -B15 -Ei 'scorm|function.*(Class|Card)|courseId|course_id' ext/noor-hub.js ext/noor-pipeline.js ext/noor-*.js | head -260 || true

      - name: Upload exact runtime source files
        uses: actions/upload-artifact@v4
        with:
          name: noor-runtime-source-2.8.120
          path: /tmp/noor-source.zip
