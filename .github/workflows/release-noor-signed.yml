name: Sign and publish Noor Firefox extension via Mozilla

on:
  push:
    paths:
      - "addons/incoming/*.xpi"
      - "addons/incoming/dropbox-request-*.json"
      - "addons/incoming/*.patch"
  workflow_dispatch:
    inputs:
      xpi_path:
        description: "Repository path to an unsigned XPI"
        type: string
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: noor-mozilla-sign-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.source.outputs.archive }}
      release_version: ${{ steps.source.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select or download the unsigned XPI
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_XPI_PATH: ${{ inputs.xpi_path || '' }}
          PUSH_SHA: ${{ github.sha }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            archive="$INPUT_XPI_PATH"
          else
            mapfile -t xpis < <(git diff-tree --no-commit-id --name-only -r "$PUSH_SHA" -- 'addons/incoming/*.xpi')
            mapfile -t requests < <(git diff-tree --no-commit-id --name-only -r "$PUSH_SHA" -- 'addons/incoming/dropbox-request-*.json')
            mapfile -t patches < <(git diff-tree --no-commit-id --name-only -r "$PUSH_SHA" -- 'addons/incoming/*.patch')
            if [[ "${#xpis[@]}" -eq 1 && "${#requests[@]}" -eq 0 && "${#patches[@]}" -eq 0 ]]; then
              archive="${xpis[0]}"
            elif [[ "${#requests[@]}" -eq 1 && "${#xpis[@]}" -eq 0 && "${#patches[@]}" -eq 0 ]]; then
              [[ -n "$DROPBOX_ACCESS_TOKEN" ]] || { echo "::error::Missing DROPBOX_ACCESS_TOKEN repository secret"; exit 1; }
              request="${requests[0]}"
              dropbox_path="$(node -e 'const r=require("./"+process.argv[1]);if(typeof r.dropbox_path!=="string"||!r.dropbox_path.startsWith("/"))process.exit(2);process.stdout.write(r.dropbox_path)' "$request")"
              filename="$(node -e 'const r=require("./"+process.argv[1]);if(typeof r.filename!=="string"||!/^[A-Za-z0-9._-]+\\.xpi$/.test(r.filename))process.exit(2);process.stdout.write(r.filename)' "$request")"
              archive="addons/incoming/$filename"
              mkdir -p addons/incoming
              curl --fail --silent --show-error --request POST \
                --url "https://content.dropboxapi.com/2/files/download" \
                --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
                --header "Dropbox-API-Arg: {\\"path\\":\\"$dropbox_path\\"}" \
                --output "$archive"
              echo "Downloaded requested XPI from Dropbox into the runner."
            elif [[ "${#patches[@]}" -eq 1 && "${#xpis[@]}" -eq 0 && "${#requests[@]}" -eq 0 ]]; then
              patch_file="${patches[0]}"
              mkdir -p extension addons/incoming
              base="addons/incoming/Noor-Unified-v2.8.120-base.xpi"
              curl --fail --silent --show-error \
                "https://raw.githubusercontent.com/rouhous/School-Teacher-Notebook-App/main/addons/files/Noor-Unified-v2.8.120-signed.xpi" \
                --output "$base"
              unzip -q "$base" -d extension
              rm -rf extension/META-INF
              python3 "$patch_file" extension
              node -e 'const fs=require("fs"),p="extension/manifest.json",m=JSON.parse(fs.readFileSync(p));m.version="2.8.121";fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n")'
              archive="addons/incoming/Noor-Unified-v2.8.121-unsigned.xpi"
              (cd extension && zip -q -r "../$archive" . -x "README.md" "*.DS_Store")
              rm -f "$base"
              echo "Built unsigned v2.8.120 from the exact published 2.8.120 package plus the reviewed attachment patch."
            else
              echo "::error::Expected exactly one XPI, one Dropbox request JSON, or one attachment patch in this push."
              exit 1
            fi
          fi
          [[ "$archive" == addons/incoming/*.xpi ]] || { echo "::error::XPI must be under addons/incoming/"; exit 1; }
          test -s "$archive"
          unzip -t "$archive" >/dev/null
          rm -rf extension
          mkdir -p extension
          unzip -q "$archive" -d extension
          test -f extension/manifest.json
          test -f extension/noor-attachment-publisher.js
          test -f extension/noor-hub.js
          test ! -e extension/lessons.js
          if unzip -Z1 "$archive" | grep -q '^META-INF/'; then
            echo "::error::Input XPI must be unsigned; META-INF signature files were found."
            exit 1
          fi
          node - "$archive" <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('extension/manifest.json','utf8'));
          if(!/^\d+\.\d+\.\d+$/.test(m.version)) throw Error('Invalid version');
          if(m.browser_specific_settings?.gecko?.id!=='noor-prep-filler-private-2026@rouhous.github.io') throw Error('Unexpected add-on ID');
          if(m.browser_specific_settings?.gecko?.update_url!=='https://rouhous.github.io/School-Teacher-Notebook-App/addons/updates.json') throw Error('Unexpected update URL');
          const scripts=(m.content_scripts||[]).flatMap(x=>x.js||[]);
          if(!scripts.includes('noor-attachment-publisher.js')||!scripts.includes('noor-hub.js')) throw Error('Required Noor scripts are missing from manifest');
          console.log(m.version);
          NODE
          version="$(node -p "require('./extension/manifest.json').version")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "Validated unsigned XPI version $version at $archive"

      - name: Upload exact unsigned XPI for signing job
        uses: actions/upload-artifact@v4
        with:
          name: noor-unsigned-xpi
          path: ${{ steps.source.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find extension -type f -name '*.js' \
            ! -name 'pdf.min.js' ! -name 'pdf.worker.min.js' ! -name 'mammoth.browser.min.js' \
            -print0 | xargs -0 -r -n1 node --check

  sign_and_publish:
    needs: validate
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      ARCHIVE: ${{ needs.validate.outputs.archive }}
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download exact unsigned XPI from validation job
        uses: actions/download-artifact@v4
        with:
          name: noor-unsigned-xpi
          path: addons/incoming
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify signing credentials and release branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Only main can publish Mozilla-signed releases"; exit 1; }
          [[ -n "$WEB_EXT_API_KEY" && -n "$WEB_EXT_API_SECRET" ]] || { echo "::error::Missing AMO_JWT_ISSUER or AMO_JWT_SECRET"; exit 1; }
          node -e 'const f=require("./addons/updates.json");const x=f.addons["noor-prep-filler-private-2026@rouhous.github.io"].updates;if(x.some(e=>e.version===process.env.RELEASE_VERSION))throw Error("Version already published")'
      - name: Prepare exact XPI for Mozilla
        run: |
          set -euo pipefail
          mkdir -p extension signed
          unzip -q "$ARCHIVE" -d extension
          npm install --prefix "$RUNNER_TEMP/noor-sign-cli" --no-save --ignore-scripts --no-audit --no-fund web-ext@10
      - name: Sign build on Mozilla AMO
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          SIGN_LOG="$(mktemp)"
          if "$RUNNER_TEMP/noor-sign-cli/node_modules/.bin/web-ext" sign --source-dir extension --artifacts-dir signed --channel unlisted --approval-timeout 1500000 >"$SIGN_LOG" 2>&1; then
            cat "$SIGN_LOG"
          elif grep -Fq "Version ${RELEASE_VERSION} already exists." "$SIGN_LOG"; then
            cat "$SIGN_LOG"
            echo "Version already submitted to AMO; importing approved XPI."
          else
            cat "$SIGN_LOG"
            exit 1
          fi
          rm -f "$SIGN_LOG"
      - name: Import and verify Mozilla-approved XPI
        shell: bash
        run: |
          set -euo pipefail
          dest="addons/files/Noor-Unified-v${RELEASE_VERSION}-signed.xpi"
          mkdir -p addons/files
          node .github/scripts/import-noor-amo-signed.mjs
          test -s "$dest"
          python3 - "$ARCHIVE" "$dest" <<'PY'
          import json, sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as source, ZipFile(sys.argv[2]) as signed:
              expected={x.filename for x in source.infolist() if not x.is_dir()}
              actual={x.filename for x in signed.infolist() if not x.is_dir() and not x.filename.startswith('META-INF/')}
              expected.discard('README.md'); actual.discard('README.md')
              if expected != actual: sys.exit('Signed XPI file list differs')
              changed=sorted(n for n in expected-{'manifest.json'} if source.read(n)!=signed.read(n))
              sm=json.loads(source.read('manifest.json')); tm=json.loads(signed.read('manifest.json'))
              sm.pop('description',None); tm.pop('description',None)
              if sm != tm: sys.exit('Signed manifest settings differ')
              if changed: sys.exit('Signed runtime files differ: '+', '.join(changed))
          print('Mozilla-signed XPI runtime contents match the exact uploaded XPI.')
          PY
          unzip -t "$dest" | tail -n 1
          unzip -Z1 "$dest" | grep -Eq '^META-INF/[^/]+\.rsa$'
          unzip -p "$dest" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const m=JSON.parse(s);if(m.version!==process.env.RELEASE_VERSION||m.browser_specific_settings?.gecko?.id!=="noor-prep-filler-private-2026@rouhous.github.io")process.exit(1)})'
          unzip -Z1 "$dest" | grep -Fxq 'noor-attachment-publisher.js'
          sha256sum "$dest"
          echo "SIGNED_XPI=$dest" >> "$GITHUB_ENV"
      - name: Save signed XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-v${{ needs.validate.outputs.release_version }}-Mozilla-signed
          path: ${{ env.SIGNED_XPI }}
          retention-days: 30
      - name: Publish signed XPI and update Firefox feed
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/publish-noor-release.mjs "$RELEASE_VERSION" "$SIGNED_XPI"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SIGNED_XPI" addons/updates.json addons/latest.json addons/index.html
          git commit -m "Publish Mozilla-signed Noor Tools v$RELEASE_VERSION"
          git push origin HEAD:main
      - name: Deploy updated GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - name: Deploy signed XPI and update feed
        id: deployment
        uses: actions/deploy-pages@v4
