# Release Noor 2.8.86: SCORM card recognition using shared catalog; preserve library tree selection.
name: Sign and publish Noor Firefox extension via Mozilla
on:
  push:
    paths:
      - ".github/workflows/release-noor-signed.yml"
      - ".github/scripts/publish-noor-release.mjs"
      - ".github/scripts/prepare-noor-2865.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Tested unified source version, e.g. 2.8.86"
        type: string
        required: true
        default: "2.8.86"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: noor-mozilla-sign-publish
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.source.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate 2.8.86 source from the existing approved 2.8.64 source
        run: python3 .github/scripts/prepare-noor-2865.py
      - name: Check source and expected extension ID
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version || '2.8.86' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          shopt -s nullglob
          files=(addons/unified/*-v"$RELEASE_VERSION"-*-source.zip)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one source ZIP for version $RELEASE_VERSION; found ${#files[@]}"
            exit 1
          fi
          echo "archive=${files[0]}" >> "$GITHUB_OUTPUT"
          mkdir -p extension
          unzip -q "${files[0]}" -d extension
          test -f extension/manifest.json
          test ! -e extension/lessons.js
          test ! -e extension/META-INF/mozilla.rsa
          node -e 'const m=require("./extension/manifest.json");if(m.version!==process.env.RELEASE_VERSION||m.browser_specific_settings?.gecko?.id!=="noor-prep-filler-private-2026@rouhous.github.io"||m.browser_specific_settings?.gecko?.update_url!=="https://rouhous.github.io/School-Teacher-Notebook-App/addons/updates.json")process.exit(1)'
          node --check .github/scripts/publish-noor-release.mjs
          test -f extension/noor-license.js
          test -f extension/noor-license-ui.js
          test -f extension/noor-scorm.js
          grep -Fq 'stnHubScormImageMode' extension/noor-hub.js
          grep -Fq 'gemini_none' extension/noor-hub.js
          grep -Fq "kind:'svg-fallback'" extension/noor-hub.js
          grep -Fq "omani-lesson-scene.svg" extension/noor-scorm.js
          grep -Fq 'stnNoorPrepSubmitReceipt:v1' extension/page-helper.js
          grep -Fq 'scheduled:true' extension/page-helper.js
          test -f extension/noor-scorm-publisher.js
          grep -Fq 'stnNoorUnitBatch:v1' extension/noor-hub.js
          grep -Fq 'confirmedUnitLessons' extension/noor-hub.js
          grep -Fq 'stnHubActivityScope' extension/noor-hub.js
          grep -Fq 'stnHubScormScope' extension/noor-hub.js
          grep -Fq 'stnHubMinimize' extension/noor-hub.js
          grep -Fq 'stnHubBatchCancel' extension/noor-hub.js
          grep -Fq 'confirmedSaved' extension/noor-scorm-publisher.js
          grep -Fq 'stnHubMinimized' extension/noor-hub.css
          grep -Fq 'manualSelection' extension/noor-hub.js
          grep -Fq 'Science Noor tree' extension/noor-lesson-numbers.js
          node - <<'NODE'
          require('./extension/noor-lesson-numbers.js');
          const r=globalThis.NoorLessonNumbers;
          const units=[{term:'الفصل الأول',termId:'s1',unitId:'u4',unit:'4 الخلايا والكائنات الحية',
            lessons:[{id:'l41',title:'4-1 خصائص الكائنات الحية'},{id:'l42',title:'4-2 الكائنات الحية الدقيقة'}]}];
          if(r.resolve(units,{semester:'1',unit:'4',lesson:'1'}).lessonId!=='l41')throw Error('Science auto lesson 4-1');
          if(r.resolve(units,{semester:'1',unit:'الوحدة الرابعة',lesson:'الدرس الثاني'}).lessonId!=='l42')throw Error('Science ordinal 4-2');
          if(r.resolve(units,{semester:'1',unit:'4',lesson:'1',manualSelection:{termId:'s1',unitId:'u4',lessonId:'l42'}}).lessonId!=='l42')throw Error('Teacher manual node choice');
          if(r.resolve(units,{semester:'1',unit:'4',lesson:'5-1'}).ok)throw Error('Cross unit false positive');
          console.log('Science auto + manual regression passed');
          NODE
          test -f extension/noor-scorm-evidence.js
          grep -Fq 'NOOR_GEMINI_SCORM_IMAGE' extension/gemini-background.js
          grep -Fq 'generateScormImage' extension/noor-hub.js
          grep -Fq 'const LESSONS_ACTION=' extension/noor-scorm-publisher.js
          grep -Fq 'function otherLibrariesAdd(panel)' extension/noor-scorm-publisher.js
          grep -Fq 'function otherLibrariesExpand(panel)' extension/noor-scorm-publisher.js
          if grep -Fq 'cards.next(' extension/noor-scorm-publisher.js; then echo 'Legacy SCORM card route must not exist'; exit 1; fi
          grep -Fq 'id="stnHubCount" type="number"' extension/noor-hub.js
          grep -Fq 'retryActivityGeneration' extension/noor-hub.js
          grep -Fq 'cancelCurrentTask' extension/noor-hub.js
          grep -Fq 'stnNoorTeacherSelection:v2:' extension/noor-hub.js
          node --check extension/noor-exam.js
          node --check extension/noor-class-card.js
          node --check extension/smart/src/noor-automator.js
          grep -Fq 'findQuestionChoice' extension/smart/src/noor-automator.js
          grep -Fq 'stnHubActivityResumeQuestions' extension/noor-hub.js
          grep -Fq 'outcomeIndex' extension/gemini-background.js
          grep -Fq 'function questionTable' extension/smart/src/noor-automator.js
          grep -Fq 'function examTypePattern' extension/noor-exam.js
          grep -Fq 'five numbered gaps' extension/smart-background.js
          grep -Fq 'function actionBlocked' extension/noor-hub.js
          grep -Fq 'id="stnHubActivityPause"' extension/noor-hub.js
          grep -Fq 'function bindPrimaryActions' extension/noor-hub.js
          test -f extension/noor-bulk-items.js
          node --check extension/noor-bulk-items.js
          grep -Fq 'qti_form' extension/noor-exam.js
          grep -Fq 'stnFilePicker' extension/noor-hub.css
          grep -Fq 'stnHubLanguage' extension/noor-hub.js
          grep -Fq 'stnNoorUiLanguage' extension/noor-ui-language.js
          grep -Fq "gradeNames.set('nineth',9)" extension/smart/src/noor-context.js
          grep -Fq 'stnHubPrepTransfer:v3' extension/page-helper.js
          grep -Fq 'applyActivityPublishDate' extension/smart/src/noor-automator.js
          grep -Fq 'generateComplete' extension/smart/src/noor-gemini.js
          grep -Fq 'omani-lesson-scene.' extension/noor-scorm.js
          grep -Fq 'function encode(bytes)' extension/noor-scorm-publisher.js
          if grep -Fq 'bytes.subarray(' extension/noor-scorm-publisher.js; then echo 'Firefox Xray unsafe subarray detected'; exit 1; fi
          grep -Fq 'NOOR_GEMINI_SCORM_GENERATE' extension/gemini-background.js
          grep -Fq 'matchQuestion' extension/noor-scorm.js
          grep -Fq 'orderQuestion' extension/noor-scorm.js
          grep -Fq 'STN_NOOR_LICENSE.authorized()' extension/gemini-background.js
          grep -Fq 'saveReviewedPreparation({automatic:true})' extension/noor-hub.js
          test -f extension/noor-lesson-numbers.js
          grep -Fq 'async activeTreeLesson()' extension/content.js
          grep -Fq 'lessonNodeId:chain[0].nodeId' extension/page-helper.js
          grep -Fq 'المحور' extension/noor-lesson-numbers.js
          test -f extension/noor-lesson-evidence.js
          grep -Fq 'resolveFromList' extension/noor-lesson-evidence.js
          grep -Fq 'unit_mismatch' extension/noor-lesson-evidence.js
          grep -Fq 'ensureVisibleSection' extension/noor-scorm-publisher.js
          grep -Fq 'resolveVerifiedLesson' extension/noor-hub.js
          grep -Fq 'async function startFromDashboard' extension/noor-hub.js
          grep -Fq 'id="stnHubDetails" hidden' extension/noor-hub.js
          grep -Fq 'value="grades" hidden disabled' extension/noor-hub.js
          grep -Fq 'allowUnlinkedLesson' extension/smart/src/noor-automator.js
          grep -Fq "const scormSaveMode=()=>'auto'" extension/noor-hub.js
          grep -Fq 'stnNoorTeacherSelection:v1:' extension/noor-hub.js
          grep -Fq 'async orderedUnit' extension/page-helper.js
          test -f extension/noor-curriculum-discovery.js
          node - <<'NODE'
          require('./extension/noor-curriculum-discovery.js');
          const d=globalThis.NoorCurriculumDiscovery;
          const branch={termId:'term',unitId:'id',lessons:[{id:'90',title:'Lesson 8'},{id:'20',title:'A new topic'}]};
          if(d.position('٣')!==3||d.lessonAt(branch,'٢')?.id!=='20'||d.lessonAt(branch,3)!==null)throw Error('Position lookup does not preserve tree order');
          if(!d.matchIds(branch,d.lessonAt(branch,2),{termId:'term',unitId:'id',lessonId:'20'}))throw Error('Tree node IDs must match');
          NODE
          test -f extension/noor-gemini-models.js
          grep -Fq 'gemini-3.5-flash-lite' extension/noor-gemini-models.js
          grep -Fq 'NoorGeminiModels.generate' extension/smart-background.js
          node -e "const m=require('./extension/manifest.json');if(m.background.scripts[0]!=='noor-license.js'||m.background.scripts[1]!=='noor-gemini-models.js')process.exit(1)"
          grep -Fq 'stnCourseCatalog:v4:' extension/noor-course-catalog.js
          grep -Fq 'stnHubDragHandle' extension/noor-hub.js
          test ! -e extension/noor-pipeline.js
          test ! -e extension/noor-pipeline-background.js
          grep -Fq 'stnHubSubject' extension/noor-hub.js
          grep -Fq 'stnHubActivityQuantity' extension/noor-hub.js
          grep -Fq 'stnHubScormQuantity' extension/noor-hub.js
          grep -Fq 'publishSelection' extension/smart/src/noor-panel.js
          find extension -type f -name '*.js' \
             ! -name 'pdf.min.js' ! -name 'pdf.worker.min.js' ! -name 'mammoth.browser.min.js' \
             -print0 | xargs -0 -r -n1 node --check
          echo "Source validated. Signing requires workflow_dispatch or an explicitly tagged [release-noor] source commit."
  sign_and_publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-noor]'))
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_VERSION: ${{ inputs.version || '2.8.86' }}
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      ARCHIVE: ${{ needs.validate.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate 2.8.86 source for Mozilla signing
        run: python3 .github/scripts/prepare-noor-2865.py
      - name: Verify one-time signing credentials and release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
             echo "::error::Only main can publish releases"
             exit 1
          fi
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
             echo "::error::Add secrets AMO_JWT_ISSUER and AMO_JWT_SECRET under GitHub repository Actions secrets"
             exit 1
          fi
          node -e 'const f=require("./addons/updates.json");const x=f.addons["noor-prep-filler-private-2026@rouhous.github.io"].updates;if(x.some(e=>e.version===process.env.RELEASE_VERSION))throw Error("Version already published")'
      - name: Prepare source for Mozilla signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extension signed
          unzip -q "$ARCHIVE" -d extension
          npm install --prefix "$RUNNER_TEMP/noor-sign-cli" --no-save --ignore-scripts --no-audit --no-fund web-ext@10
      - name: Sign on Mozilla as unlisted add-on
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          SIGN_LOG="$(mktemp)"
          if "$RUNNER_TEMP/noor-sign-cli/node_modules/.bin/web-ext" sign \
            --source-dir extension \
            --artifacts-dir signed \
            --channel unlisted \
            --approval-timeout 1500000 >"$SIGN_LOG" 2>&1; then
            cat "$SIGN_LOG"
          elif grep -Fq "Version ${RELEASE_VERSION} already exists." "$SIGN_LOG"; then
            echo "This version already exists at Mozilla. The next step will import and verify the approved XPI."
          else
            cat "$SIGN_LOG"
            exit 1
          fi
          rm -f "$SIGN_LOG"
      - name: Verify the returned signed XPI
        shell: bash
        run: |
          set -euo pipefail
          dest="addons/files/Noor-Unified-v${RELEASE_VERSION}-signed.xpi"
          mkdir -p addons/files
          # Re-import the approved XPI from Mozilla using the developer API; verify its hash against AMO.
          node .github/scripts/import-noor-amo-signed.mjs
          test -s "$dest"
          python3 - "$ARCHIVE" "$dest" <<'PY'
          import json
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as source, ZipFile(sys.argv[2]) as signed:
              expected = {item.filename for item in source.infolist() if not item.is_dir()}
              actual = {item.filename for item in signed.infolist()
                        if not item.is_dir() and not item.filename.startswith('META-INF/')}
              expected.discard('README.md')
              actual.discard('README.md')
              if expected != actual:
                  sys.exit('Signed XPI file list differs: ' + ', '.join(sorted(expected ^ actual)))
              changed = sorted(name for name in expected - {'manifest.json'}
                               if source.read(name) != signed.read(name))
              source_manifest = json.loads(source.read('manifest.json'))
              signed_manifest = json.loads(signed.read('manifest.json'))
              # Description is store metadata; require all runtime settings to match.
              source_manifest.pop('description', None)
              signed_manifest.pop('description', None)
              if source_manifest != signed_manifest:
                  fields = sorted(key for key in source_manifest.keys() | signed_manifest.keys()
                                  if source_manifest.get(key) != signed_manifest.get(key))
                  sys.exit('Signed manifest settings differ: ' + ', '.join(fields))
              if changed:
                  sys.exit('Signed XPI content differs: ' + ', '.join(changed))
          print('Signed XPI runtime contents match the validated archive.')
          PY
          unzip -t "$dest" | tail -n 1
          unzip -Z1 "$dest" | grep -Eq '^META-INF/[^/]+\.rsa$'
          unzip -p "$dest" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const m=JSON.parse(s);if(m.version!==process.env.RELEASE_VERSION||m.browser_specific_settings?.gecko?.id!=="noor-prep-filler-private-2026@rouhous.github.io")process.exit(1)})'
          for f in noor-hub.js noor-exam.js noor-class-card.js noor-course-catalog.js noor-scorm.js noor-grade-csv.js smart/src/noor-panel.js; do unzip -Z1 "$dest" | grep -Fxq "$f"; done
          ! unzip -Z1 "$dest" | grep -Exq 'noor-pipeline.js|noor-pipeline-background.js'
          ! unzip -Z1 "$dest" | grep -Fxq lessons.js
          sha256sum "$dest"
          echo "SIGNED_XPI=$dest" >> "$GITHUB_ENV"
      - name: Save the signed XPI as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-v${{ inputs.version || '2.8.86' }}-Mozilla-signed
          path: ${{ env.SIGNED_XPI }}
          retention-days: 30
      - name: Publish the signed XPI and update manifest
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/publish-noor-release.mjs "$RELEASE_VERSION" "$SIGNED_XPI"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SIGNED_XPI" addons/updates.json addons/latest.json addons/index.html
          git commit -m "Publish Mozilla-signed Noor Tools v${RELEASE_VERSION}"
          git push origin HEAD:main
      - name: Remove temporary source and signing files
        shell: bash
        run: rm -rf extension signed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for GitHub Pages artifact indexing
        run: sleep 20
      - name: Deploy signed XPI and the updated Notebook library
        id: deployment
        uses: actions/deploy-pages@v4
